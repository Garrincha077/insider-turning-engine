version: scoring.v1
score_scale:
  minimum: 0
  maximum: 100

models:
  market_pulse:
    missing_factor_policy: reject
    weights:
      transaction: 0.15
      unique_insiders: 0.20
      dollar: 0.20
      volume: 0.10
      company_breadth: 0.15
      conviction_weighted: 0.20

  company_insider:
    missing_factor_policy: reject
    weights:
      conviction: 0.45
      cluster: 0.25
      opportunistic: 0.20
      net_buying_absence_sales: 0.10

  divergence:
    missing_factor_policy: reject
    weights:
      price_weakness: 0.35
      insider_activity_percentile: 0.35
      acceleration_cluster: 0.20
      absence_relevant_sales: 0.10

  turn:
    missing_factor_policy: reject
    weights:
      base_structure: 0.35
      ordinary_rs_turn: 0.25
      mansfield_market: 0.15
      mansfield_sector: 0.10
      volume_accumulation: 0.10
      cost_basis_reclaim: 0.05

  total:
    missing_factor_policy:
      fundamental: exclude_and_renormalize_remaining_weights
      all_other_factors: reject
    weights:
      divergence: 0.25
      conviction: 0.15
      cluster: 0.10
      opportunistic: 0.10
      base: 0.10
      ordinary_rs: 0.10
      mansfield_rs: 0.10
      volume: 0.05
      fundamental: 0.05

component_contract:
  status: complete
  point_in_time:
    percentile_method: midrank
    history_inclusion: known_at_strictly_before_as_of
    future_row_policy: reject
    weekly_slope_history:
      maximum_observations: 104
      minimum_observations: 26
    daily_volume_history:
      maximum_observations: 252
      minimum_observations: 60
    insufficient_history:
      value: 50
      reason_code: LOW_CONFIDENCE_HISTORY
  dollar_winsorization:
    percentile: 0.995
    quantile_method: type_7_linear
    minimum_prior_observations: 200
    insufficient_history_policy: no_cap_with_quality_flag
  base_structure:
    no_new_52_week_low_20_sessions: 25
    volatility_20d_at_most_80pct_prior_20d: 20
    median_volume_20d_at_most_80pct_prior_20d: 20
    absolute_ma20_slope_5d_at_most_0_001_price_per_session: 20
    close_at_or_above_ma20: 15
  ordinary_rs_turn:
    current_ordinary_rs_3m: 0.30
    prior_percentile_ordinary_rs_3m_slope_4w: 0.70
  mansfield:
    level_linear_clamp:
      minus_10: 0
      zero: 50
      plus_10: 100
    level: 0.30
    prior_percentile_slope_4w: 0.70
  volume_accumulation:
    window_sessions: 20
    signed_volume_ratio_fixed_linear_clamp:
      minus_0_10: 0
      plus_0_30: 100
    fixed_score: 0.50
    prior_percentile: 0.50
  cost_basis_reclaim:
    basis_window_calendar_days: 90
    fresh_cross_sessions: 10
    fresh_cross_score: 100
    above_without_fresh_cross_score: 50
    below_score: 0
  company_insider:
    aggregation_window_calendar_days: 90
    cluster_window_calendar_days: 30
    conviction: winsorized_dollar_weighted_qualified_buys
    cluster: maximum_cluster_score
    opportunistic: winsorized_dollar_weighted_qualified_buys
    net_buying_absence_sales: buy_dollars_over_buy_plus_sale_dollars
  total_inputs:
    mansfield_rs:
      market: 0.60
      sector: 0.40
    fundamental: null_excluded_and_remaining_weights_renormalized
    missing_required_component: reject
  stale_data:
    state_policy: hold_prior_state
    reason_code: STALE_DATA_HOLD
    alerts_allowed: false

state_model:
  version: state.v1
  ordered_states:
    - FALLING
    - INSIDER_ACCUMULATION
    - BASE_FORMING
    - EARLY_TURN
    - CONFIRMED_TURN

  FALLING:
    all:
      - metric: return_3m
        operator: lt
        value: 0
      - metric: close
        operator: lt_metric
        value: ma50

  INSIDER_ACCUMULATION:
    all:
      - metric: drawdown_from_52_week_high
        operator: lte
        value: -0.20
      - metric: company_insider_score
        operator: gte
        value: 65
      - metric: qualified_buy_age_days
        operator: lte
        value: 30

  BASE_FORMING:
    all:
      - condition: prior_accumulation
        equals: true
      - condition: no_new_52_week_low
        window_sessions: 20
        equals: true
    evidence:
      minimum_matches: 2
      of:
        - volatility_contraction
        - volume_dryup
        - ma20_flattening

  EARLY_TURN:
    requires_state: BASE_FORMING
    all:
      - metric: turn_score
        operator: gte
        value: 60
      - metric: ordinary_rs_3m
        trend: improving
        window_weeks: 4
      - metric: mansfield_market
        statistic: slope
        window_weeks: 4
        operator: gt
        value: 0

  CONFIRMED_TURN:
    requires_state: EARLY_TURN
    all:
      - metric: close_above_ma50
        minimum_matching_sessions: 5
        window_sessions: 10
    any:
      - metric: mansfield_market
        operator: gte
        value: 0
      - condition: cost_basis_reclaim
        equals: true

  downgrade:
    consecutive_failed_evaluations: 2
    immediate_reset:
      condition: new_52_week_low
      target_state: FALLING

alerts:
  MAJOR_INSIDER_BUY:
    any:
      - all:
          - metric: conviction_score
            operator: gte
            value: 80
          - metric: transaction_value_usd
            operator: gte
            value: 250000
      - metric: transaction_value_usd
        operator: gte
        value: 1000000
      - any_flag:
          - strong_cluster
          - first_buy
          - largest_buy

  STEALTH_ACCUMULATION:
    all:
      - metric: company_insider_score
        operator: gte
        value: 70
      - metric: divergence_score
        operator: gte
        value: 75
      - metric: turn_score
        operator: gte
        value: 45
      - condition: no_new_52_week_low
        window_sessions: 20
        equals: true
      - metric: ordinary_rs_3m
        statistic: slope
        operator: gt
        value: 0
      - metric: mansfield_market
        statistic: slope
        operator: gt
        value: 0

  TURNING:
    all:
      - transition_to_any:
          - EARLY_TURN
          - CONFIRMED_TURN
      - metric: total_score
        operator: gte
        value: 75
      - metric: company_insider_score
        operator: gte
        value: 65
      - metric: divergence_score
        operator: gte
        value: 65

  delivery:
    cooldown_days: 14
    cooldown_scope:
      - issuer_cik
      - alert_type
    override_if_any:
      - state_changed
      - severity_changed
      - important_flag_changed
      - metric: absolute_score_delta
        operator: gte
        value: 7

providers:
  sec:
    max_internal_requests_per_second: 6

quality_gates:
  parse_success_rate:
    operator: gte
    value: 0.995
  market_data_coverage_rate:
    operator: gte
    value: 0.90
  core_branch_coverage_rate:
    operator: gte
    value: 0.85
