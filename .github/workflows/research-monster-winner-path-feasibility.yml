name: Audit Monster Winner MFE path feasibility

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-monster-winner-path-feasibility.yml"
      - "scripts/research_monster_winner_path_feasibility.py"
      - "tests/test_research_monster_winner_path_feasibility.py"
      - "docs/research-monster-winner-enrichment-v1-path-feasibility-gate.md"
      - "research/monster-winner-enrichment-v1.json"

permissions:
  contents: write

concurrency:
  group: research-monster-winner-enrichment-path-feasibility-v1
  cancel-in-progress: false

env:
  STAGE_A_RELEASE: research-phase1-insider-feature-tournament-stage-a-v1
  STAGE_A_ASSET: phase1-insider-feature-tournament-stage-a-v1.tar.gz
  STAGE_A_DIGEST: sha256:06bd11f7ea2352d95e0b3bcdb997af869b6b020c46c224e5ac942bb9a0eccb0d

  CONTINUITY_AUDIT_RELEASE: research-phase1-feature-tournament-stage-b-continuity-audit-v1
  CONTINUITY_AUDIT_ASSET: feature-tournament-stage-b-continuity-audit-v1.tar.gz
  CONTINUITY_AUDIT_DIGEST: sha256:77066ec138f53c0572a206559294768c6c898270ba6dcc3b2429ac7ddddab88f

  FINAL_CONTINUITY_RELEASE: research-phase1-feature-tournament-stage-b-final-continuity-v1
  FINAL_CONTINUITY_ASSET: stage-b-final-continuity.json
  FINAL_CONTINUITY_DIGEST: sha256:24947122c8fa776dc6f5e8f628c5b45cdbec6551cf15df334421b405439b4518

  PROVIDER_AMENDMENT_RELEASE: research-phase1-feature-tournament-provider-completeness-amendment-v1
  PROVIDER_AMENDMENT_ASSET: provider-completeness-amendment.json
  PROVIDER_AMENDMENT_DIGEST: sha256:faf787e918b953dcffbcc2b714c34873d6228031e25a09e509ee58e1a067fbb2

  MARKET_RELEASE: research-market-alpaca-v1
  DISCOVERY_HELPER_BLOB: 4bf0717f1d866dfbd282dd365f6e466f0cc92900
  CONFIRMATION_HELPER_BLOB: 3928f68552b19ccb5da1459ba5ba78f48ae2d0f4
  MONSTER_CONTRACT_BLOB: 89864635996f6665f3ab0512c377ddf26d8f3689

  RESULT_RELEASE: research-monster-winner-enrichment-path-feasibility-v1
  RESULT_ARCHIVE: monster-winner-path-feasibility-v1.tar.gz

jobs:
  audit:
    name: Performance-blind 252-session holder-path audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups --frozen

      - name: Pin frozen contracts and routing helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research_phase1_feature_tournament_discovery.py)" = "$DISCOVERY_HELPER_BLOB"
          test "$(git hash-object scripts/research_phase1_feature_tournament_confirmation.py)" = "$CONFIRMATION_HELPER_BLOB"
          test "$(git hash-object research/monster-winner-enrichment-v1.json)" = "$MONSTER_CONTRACT_BLOB"

      - name: Lint and test path-feasibility semantics
        run: |
          uv run ruff check scripts/research_monster_winner_path_feasibility.py tests/test_research_monster_winner_path_feasibility.py
          uv run pytest -q tests/test_research_monster_winner_path_feasibility.py

      - name: Assert implementation cannot access market prices
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source=Path("scripts/research_monster_winner_path_feasibility.py").read_text()
          forbidden=(
              'row["open"]',
              'row["high"]',
              'row["low"]',
              'row["close"]',
              'row["vwap"]',
              "row.get(\"open\")",
              "row.get(\"high\")",
              "row.get(\"low\")",
              "row.get(\"close\")",
              "row.get(\"vwap\")",
          )
          for token in forbidden:
              assert token not in source, token
          PY

      - name: Download and verify frozen Stage A and continuity inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/download/stage-a work/stage-a work/download/continuity work/continuity work/output

          gh release download "$STAGE_A_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$STAGE_A_ASSET" --dir work/download/stage-a
          test "sha256:$(sha256sum "work/download/stage-a/$STAGE_A_ASSET" | cut -d' ' -f1)" = "$STAGE_A_DIGEST"
          tar -xzf "work/download/stage-a/$STAGE_A_ASSET" -C work/stage-a             summary.json stage-a-feature-matrix.csv stage-a-cutpoints.json

          gh release download "$CONTINUITY_AUDIT_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$CONTINUITY_AUDIT_ASSET" --dir work/download/continuity
          test "sha256:$(sha256sum "work/download/continuity/$CONTINUITY_AUDIT_ASSET" | cut -d' ' -f1)" = "$CONTINUITY_AUDIT_DIGEST"
          tar -xzf "work/download/continuity/$CONTINUITY_AUDIT_ASSET"             -C work/continuity ledger/continuity-ledger.csv ca/corporate-actions.json

          gh release download "$FINAL_CONTINUITY_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$FINAL_CONTINUITY_ASSET" --dir work/continuity
          test "sha256:$(sha256sum "work/continuity/$FINAL_CONTINUITY_ASSET" | cut -d' ' -f1)" = "$FINAL_CONTINUITY_DIGEST"

      - name: Download and verify frozen 2016-2022 market-presence inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/download/market work/market
          declare -A DIGESTS=(
            [2016]=df531881b67f9f42e40b2c2fff03f6ca19c0b5f9b13deb6190132b7987fb69ca
            [2017]=7515a3807249bbead7cf7edc2a2aa1d267b01fc49ddf72885c40746520e762d0
            [2018]=4a99eafc6cac31ee30d23bf82c1feccb4bbe14919f7c4df2d59e792f8a5b2f54
            [2019]=c701d559a7d5128fd07ec19e2d5d3b39eb5ae8c0d9bd51a8b278d34c9b6f9238
            [2020]=5577a548576e81c5e468b9e5027c9a8ec1ba8e1dd14ed38a0f223e797c5358e2
            [2021]=550ff3456ad16a045692a5d9d567d13ef2b8788283f4c39c3baa5d8aecd7a704
            [2022]=8a71037090cda77bc3937409ffa9fcb9c463545b5f3a7d9a73995a92759d187a
          )
          for year in 2016 2017 2018 2019 2020 2021 2022; do
            asset="alpaca-market-$year.tar.gz"
            gh release download "$MARKET_RELEASE" --repo "$GITHUB_REPOSITORY"               --pattern "$asset" --dir work/download/market
            test "$(sha256sum "work/download/market/$asset" | cut -d' ' -f1)" = "${DIGESTS[$year]}"
            mkdir -p "work/market/$year"
            tar -xzf "work/download/market/$asset" -C "work/market/$year"               "canonical-market-$year.csv"
          done
          test ! -e work/market/2023

      - name: Run performance-blind holder-path feasibility audit
        run: >-
          uv run python scripts/research_monster_winner_path_feasibility.py
          --stage-a-dir work/stage-a
          --ledger work/continuity/ledger/continuity-ledger.csv
          --corporate-actions work/continuity/ca/corporate-actions.json
          --final-contract "work/continuity/$FINAL_CONTINUITY_ASSET"
          --provider-amendment "work/continuity/$PROVIDER_AMENDMENT_ASSET"
          --market-root work/market
          --output work/output

      - name: Assert outcome-blind audit boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          p=json.loads(Path("work/output/summary.json").read_text())
          assert p["status"]=="MONSTER_WINNER_ENRICHMENT_V1_PATH_FEASIBILITY_AUDITED"
          assert p["definitionId"]=="MONSTER_WINNER_ENRICHMENT_V1"
          assert p["sourceStageAEvents"]==24190
          assert p["distinctIssuers"]==4729
          assert p["primaryHorizonSessions"]==252
          assert p["pathObservationSessions"]==253
          assert p["performanceRead"] is False
          assert p["priceFieldsRead"]==[]
          assert p["outcomeFieldsRead"]==[]
          assert p["monsterLabelsComputed"] is False
          assert p["thresholdCrossingsRead"] is False
          assert p["mfeValuesComputed"] is False
          assert p["providerCompletenessAmendmentRows"]==13
          assert p["knownSampleDiagnosticOpened"] is False
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False

          with Path("work/output/monster-path-feasibility.csv").open(newline="") as f:
              reader=csv.DictReader(f)
              rows=list(reader)
              fields=[x.lower() for x in (reader.fieldnames or [])]
          assert len(rows)==24190
          forbidden=("open","high","low","close","vwap","return","excess","mfe","threshold","monster")
          assert not any(token in field for field in fields for token in forbidden)
          assert all(int(r["requiredPathSessions"])==253 for r in rows)
          print(json.dumps({
              "negativeLabelFeasibleEvents":p["negativeLabelFeasibleEvents"],
              "negativeLabelFeasibleShare":p["negativeLabelFeasibleShare"],
              "mfeUnknownIfNoPositiveEvents":p["mfeUnknownIfNoPositiveEvents"],
              "reasonCounts":p["reasonCounts"],
              "coverageDistribution":p["coverageDistribution"],
          },indent=2,sort_keys=True))
          PY

      - name: Publish immutable path-feasibility audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp docs/research-monster-winner-enrichment-v1-path-feasibility-gate.md work/output/
          cp research/monster-winner-enrichment-v1.json work/output/
          tar -C work/output -czf "work/$RESULT_ARCHIVE"             summary.json             monster-path-feasibility.csv             research-monster-winner-enrichment-v1-path-feasibility-gate.md             monster-winner-enrichment-v1.json

          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Monster Winner Enrichment path feasibility v1"               --notes "Performance-blind 252-session holder-path coverage audit for all 24,190 frozen B0 development events. No OHLC prices, MFE values, monster labels, 2021-2022 known-sample diagnostics or 2023+ OOS outcomes were opened."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE"             "work/$RESULT_ARCHIVE"             work/output/summary.json             --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: monster-winner-path-feasibility-${{ github.run_id }}
          path: work/output
          retention-days: 90
