name: Freeze F2 validation residual-19 continuity scope

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-phase1-feature-tournament-validation-residual19-scope.yml"
      - "scripts/research_phase1_feature_tournament_validation_residual19_scope.py"
      - "tests/test_research_phase1_feature_tournament_validation_residual19_scope.py"
      - "docs/research-phase1-feature-tournament-validation-residual19-scope-gate.md"

permissions:
  contents: write

env:
  SOURCE_RELEASE: research-phase1-insider-feature-tournament-validation-residual27-scope-v1
  SOURCE_ASSET: validation-residual27-scope.json
  SOURCE_DIGEST: sha256:04b4e2280e9059aed8c10f9a6d9ac1853f23f34f5028dba6482c014c1ff190a4
  RESOLUTION_RELEASE: research-phase1-insider-feature-tournament-validation-incomplete-stock-merger-resolution-v1
  RESOLUTION_ASSET: validation-incomplete-stock-merger-primary-resolution.json
  RESOLUTION_DIGEST: sha256:73722b4c87590a8a1fc0ad748534ce19a0d788281b965df1e475bc0dc789d584
  RESULT_RELEASE: research-phase1-insider-feature-tournament-validation-residual19-scope-v1
  RESULT_ASSET: validation-residual19-scope.json

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen

      - name: Lint and test residual-19 freezer
        run: |
          uv run ruff check scripts/research_phase1_feature_tournament_validation_residual19_scope.py tests/test_research_phase1_feature_tournament_validation_residual19_scope.py
          uv run pytest -q tests/test_research_phase1_feature_tournament_validation_residual19_scope.py

      - name: Download and verify immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/input work/output
          gh release download "$SOURCE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_ASSET" --dir work/input
          gh release download "$RESOLUTION_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$RESOLUTION_ASSET" --dir work/input
          test "sha256:$(sha256sum "work/input/$SOURCE_ASSET" | cut -d' ' -f1)" = "$SOURCE_DIGEST"
          test "sha256:$(sha256sum "work/input/$RESOLUTION_ASSET" | cut -d' ' -f1)" = "$RESOLUTION_DIGEST"

      - name: Freeze residual-19 scope
        run: >-
          uv run python scripts/research_phase1_feature_tournament_validation_residual19_scope.py
          --source "work/input/$SOURCE_ASSET"
          --resolution "work/input/$RESOLUTION_ASSET"
          --output "work/output/$RESULT_ASSET"

      - name: Assert residual-19 partition and closed validation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("work/output/validation-residual19-scope.json").read_text())
          assert p["status"]=="PHASE1_FEATURE_TOURNAMENT_VALIDATION_RESIDUAL19_SCOPE_FROZEN"
          assert p["sourceResidualRows"]==27
          assert p["subtractedIncompleteStockMergerRows"]==8
          assert p["residualRows"]==19
          assert p["scopeKeySha256"]=="sha256:612f62f79717037ecb858998a03cf5fb6d6ce927f308fd08f535af5eeb99945d"
          assert p["categoryCounts"]=={
              "LONG_GAP_NEW_PRIMARY_EVIDENCE_REQUIRED":10,
              "PROVIDER_NEW_PRIMARY_EVIDENCE_REQUIRED":9,
          }
          assert p["waveCounts"]=={
              "nameChangeStockMergerRows":8,
              "standaloneNameChangeRows":1,
              "longGapRows":10,
          }
          assert p["performanceRead"] is False
          assert p["featureOutcomesRead"] is False
          assert p["validationOpened"] is False
          assert p["validationPerformanceOpened"] is False
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          PY

      - name: Publish immutable residual-19 scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Phase-1 F2 validation residual-19 continuity scope v1"               --notes "Performance-blind 19-row validation continuity residual after eight incomplete stock-merger primary resolutions. Validation performance and 2023+ OOS remain closed."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE" "work/output/$RESULT_ASSET" --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: phase1-insider-feature-tournament-validation-residual19-scope-${{ github.run_id }}
          path: work/output
          retention-days: 90
