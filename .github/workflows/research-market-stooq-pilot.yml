name: Research Stooq market diagnostic 2013-2022

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-market-stooq-pilot.yml"
      - "scripts/research_market_stooq_pilot.py"

permissions:
  contents: read

jobs:
  pilot:
    name: Bounded Stooq market diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Lint research diagnostic
        run: uv run ruff check scripts/research_market_stooq_pilot.py
      - name: Probe bounded 2013-2022 Stooq access
        run: >-
          uv run python scripts/research_market_stooq_pilot.py
          --start 2013-01-01
          --end 2022-12-30
          --output work/stooq-pilot
      - name: Assert research boundary only
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("work/stooq-pilot/summary.json").read_text())
          assert s["serverSideDateBoundsRequested"] is True
          assert s["adjustedPricesAvailable"] is False
          assert s["delistedCoverageValidated"] is False
          assert s["historicalIdentityValidated"] is False
          assert s["marketDataJoined"] is False
          assert s["canonicalReady"] is False
          assert s["signalReady"] is False
          assert s["oosOpened"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stooq-market-diagnostic-2013-2022-${{ github.run_id }}
          path: work/stooq-pilot
          retention-days: 90
