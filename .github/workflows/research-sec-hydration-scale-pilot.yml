name: Test scalable historical SEC hydration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-sec-hydration-scale-pilot.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: research-sec-hydration-scale-pilot
  cancel-in-progress: false

env:
  SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
  CANDIDATE_RUN_ID: "34884538222"
  YEAR: "2016"
  QUARTER: "1"
  MAX_ACCESSIONS: "500"
  MAX_WORKERS: "4"

jobs:
  hydrate:
    name: Hydrate 500 historical buys with bounded concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Require SEC User-Agent
        shell: bash
        run: |
          test -n "${SEC_USER_AGENT:-}" || { echo "SEC_USER_AGENT repository variable is required"; exit 1; }
      - name: Download candidate universe
        uses: actions/download-artifact@v4
        with:
          name: sec-candidates-${{ env.YEAR }}-${{ env.CANDIDATE_RUN_ID }}
          path: work/sec-candidates/${{ env.YEAR }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Run bounded concurrent PIT hydration
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import threading
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import UTC, date, datetime, timedelta
          from pathlib import Path

          from insider_turning_engine.ingestion.sec.daily_index import SECDailyIndexSource
          from insider_turning_engine.ingestion.sec.parser import parse_sec_filing

          year = int(os.environ["YEAR"])
          quarter = int(os.environ["QUARTER"])
          maximum = int(os.environ["MAX_ACCESSIONS"])
          workers = int(os.environ["MAX_WORKERS"])
          if not (1 <= workers <= 6 and 1 <= maximum <= 1000):
              raise SystemExit("unsafe scale-pilot bounds")
          out = Path("work/sec-hydration-scale-pilot")
          out.mkdir(parents=True, exist_ok=True)
          candidate_path = Path("work/sec-candidates") / str(year) / "candidates.jsonl"

          def bulk_date(value):
              value = str(value).strip()
              for fmt in ("%Y-%m-%d", "%d-%b-%Y"):
                  try:
                      return datetime.strptime(value, fmt).date()
                  except ValueError:
                      pass
              raise ValueError(f"unsupported bulk date {value!r}")

          candidates = []
          for line in candidate_path.read_text(encoding="utf-8").splitlines():
              row = json.loads(line)
              filed = bulk_date(row["filingDate"])
              if (
                  int(row["sourceQuarter"]) == quarter
                  and int(row["buyCount"]) > 0
                  and not str(row["documentType"]).upper().endswith("/A")
              ):
                  row["_filed"] = filed
                  candidates.append(row)
          candidates.sort(key=lambda row: (row["_filed"], row["accession"]))
          selected = candidates[:maximum]
          if len(selected) != maximum:
              raise SystemExit(f"expected {maximum} selected candidates, found {len(selected)}")
          targets = {str(row["accession"]): row for row in selected}

          started = time.monotonic()
          discovery = SECDailyIndexSource(
              os.environ["SEC_USER_AGENT"], cache_dir=out / "sec-cache-discovery"
          )
          matches = {}
          try:
              first_day = min(row["_filed"] for row in selected)
              last_day = max(row["_filed"] for row in selected) + timedelta(days=10)
              published = []
              cursor = first_day
              while cursor <= last_day:
                  end = min(last_day, cursor + timedelta(days=30))
                  published.extend(discovery.discover_days(cursor, end))
                  cursor = end + timedelta(days=1)
              for index_day in sorted(set(published)):
                  entries = discovery.discover_day(index_day)
                  index_hash = discovery.last_index_hash
                  for entry in entries:
                      candidate = targets.get(entry.accession_number)
                      if candidate is None:
                          continue
                      lag = (index_day - candidate["_filed"]).days
                      if lag < 0 or lag > 10:
                          continue
                      prior = matches.get(entry.accession_number)
                      if prior is None or index_day < prior[1]:
                          matches[entry.accession_number] = (entry, index_day, index_hash)
          finally:
              discovery.close()

          local = threading.local()
          sources = []
          sources_lock = threading.Lock()

          def worker_source():
              source = getattr(local, "source", None)
              if source is None:
                  source = SECDailyIndexSource(
                      os.environ["SEC_USER_AGENT"],
                      cache_dir=out / "sec-cache-filings",
                  )
                  local.source = source
                  with sources_lock:
                      sources.append(source)
              return source

          def hydrate(candidate):
              accession = str(candidate["accession"])
              match = matches.get(accession)
              if match is None:
                  return {"ok": False, "accession": accession, "stage": "DISCOVERY", "reason": "NOT_FOUND"}
              entry, index_day, index_hash = match
              try:
                  raw = worker_source().fetch_entry(entry, index_hash=index_hash)
                  if raw.payload is None:
                      raise ValueError("missing ownership XML")
                  if raw.issuer_cik != str(candidate["issuerCik"]):
                      raise ValueError("issuer CIK mismatch")
                  run_id = "run_hist_" + hashlib.sha256(accession.encode()).hexdigest()[:24]
                  parsed = parse_sec_filing(raw.payload, {
                      "provider": "sec",
                      "provider_record_id": raw.provider_record_id,
                      "accession_number": raw.accession_number,
                      "form_type": raw.form_type,
                      "source_url": raw.source_url,
                      "accepted_at": raw.accepted_at,
                      "observed_at": raw.accepted_at,
                      "recorded_at": raw.retrieved_at,
                      "run_id": run_id,
                  })
                  if parsed.quarantines:
                      return {
                          "ok": False, "accession": accession, "stage": "PARSE",
                          "reason": "QUARANTINE", "quarantines": [q.model_dump(mode="json") for q in parsed.quarantines],
                      }
                  records = list(parsed.records)
                  if not records:
                      raise ValueError("no canonical records")
                  dumped = []
                  purchases = 0
                  for record in records:
                      if record.timestamps.accepted_at != raw.accepted_at:
                          raise ValueError("accepted_at mismatch")
                      if record.timestamps.knowledge_at != raw.accepted_at:
                          raise ValueError("knowledge_at mismatch")
                      if record.timestamps.recorded_at != raw.retrieved_at:
                          raise ValueError("recorded_at mismatch")
                      item = record.canonical_dump()
                      item["researchBackfill"] = {
                          "historicalAvailabilityBasis": "SEC_ACCEPTANCE_DATETIME",
                          "actualRetrievedAt": raw.retrieved_at.astimezone(UTC).isoformat(),
                          "indexDate": index_day.isoformat(),
                          "bulkFilingDate": candidate["_filed"].isoformat(),
                          "canonicalReady": False,
                      }
                      dumped.append(item)
                      if item.get("transaction", {}).get("economicClassification") == "OPEN_MARKET_PURCHASE":
                          purchases += 1
                  return {
                      "ok": True,
                      "accession": accession,
                      "manifest": {
                          "accession": accession,
                          "issuerCik": raw.issuer_cik,
                          "formType": raw.form_type,
                          "acceptedAt": raw.accepted_at.astimezone(UTC).isoformat(),
                          "actualRetrievedAt": raw.retrieved_at.astimezone(UTC).isoformat(),
                          "indexDate": index_day.isoformat(),
                          "bulkFilingDate": candidate["_filed"].isoformat(),
                          "contentHash": raw.content_hash,
                          "sourceUrl": raw.source_url,
                          "provenance": dict(raw.provenance),
                      },
                      "records": dumped,
                      "purchaseRows": purchases,
                  }
              except (RuntimeError, ValueError, OSError, TypeError) as exc:
                  return {
                      "ok": False, "accession": accession, "stage": "HYDRATE_PARSE_VALIDATE",
                      "reason": type(exc).__name__, "message": str(exc)[:300],
                  }

          results = []
          with ThreadPoolExecutor(max_workers=workers) as pool:
              futures = [pool.submit(hydrate, row) for row in selected]
              for future in as_completed(futures):
                  results.append(future.result())
          for source in sources:
              source.close()

          good = sorted((row for row in results if row["ok"]), key=lambda row: row["accession"])
          bad = sorted((row for row in results if not row["ok"]), key=lambda row: row["accession"])
          manifests = [row["manifest"] for row in good]
          records = [item for row in good for item in row["records"]]
          purchase_rows = sum(row["purchaseRows"] for row in good)
          elapsed = time.monotonic() - started

          def write_jsonl(path, rows):
              with path.open("w", encoding="utf-8") as stream:
                  for row in rows:
                      stream.write(json.dumps(row, sort_keys=True, default=str) + "\n")

          write_jsonl(out / "raw-manifest.jsonl", manifests)
          write_jsonl(out / "canonical-research.jsonl", records)
          write_jsonl(out / "failures.jsonl", bad)
          summary = {
              "schemaVersion": "1.0.0",
              "source": "sec-historical-pit-hydration-scale-pilot",
              "year": year,
              "quarter": quarter,
              "selectedOriginalBuyFilings": len(selected),
              "matchedInDailyIndex": len(matches),
              "hydratedAndParsedFilings": len(good),
              "failureCount": len(bad),
              "canonicalRecordCount": len(records),
              "openMarketPurchaseRecordCount": purchase_rows,
              "maxWorkers": workers,
              "elapsedSeconds": round(elapsed, 3),
              "filingsPerSecond": round(len(good) / elapsed, 3) if elapsed else None,
              "allCanonicalKnowledgeEqualAccepted": all(
                  item["timestamps"]["knowledgeAt"] == item["timestamps"]["acceptedAt"]
                  for item in records
              ),
              "canonicalReady": False,
              "signalReady": False,
              "oosOpened": False,
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Publish pilot summary
        if: always()
        shell: bash
        run: |
          test -s work/sec-hydration-scale-pilot/summary.json || exit 1
          cat work/sec-hydration-scale-pilot/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-hydration-scale-pilot-2016q1-${{ github.run_id }}
          path: |
            work/sec-hydration-scale-pilot/summary.json
            work/sec-hydration-scale-pilot/raw-manifest.jsonl
            work/sec-hydration-scale-pilot/canonical-research.jsonl
            work/sec-hydration-scale-pilot/failures.jsonl
          if-no-files-found: warn
          retention-days: 90
