name: Corroborate residual B3 with all bounded Form345 filings

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-phase1-b3-residual-form345.yml"
      - "scripts/research_phase1_b3_residual_form345.py"
      - "docs/research-phase1-b3-residual-form345.md"

permissions:
  contents: write
  actions: read

concurrency:
  group: research-phase1-b3-residual-form345-v1
  cancel-in-progress: false

env:
  SOURCE_RELEASE: research-phase1-b3-residual-sec-title-v1
  SOURCE_ASSET: b3-residual-sec-title-corroboration.json
  SOURCE_DIGEST: sha256:f065a343437aa2499ea614de53bfea6c7a9dc852c7e1e77f69656ecea6e68eba
  HISTORY_RUN_ID: "34883719192"
  RESULT_RELEASE: research-phase1-b3-residual-form345-v1

jobs:
  corroborate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen

      - name: Verify frozen residual source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source work/history work/output
          gh release view "$SOURCE_RELEASE" --repo "$GITHUB_REPOSITORY" --json assets > work/source-assets.json
          python - <<'PY'
          import json, os
          assets={x["name"]:x for x in json.load(open("work/source-assets.json"))["assets"]}
          assert assets[os.environ["SOURCE_ASSET"]].get("digest")==os.environ["SOURCE_DIGEST"]
          PY
          gh release download "$SOURCE_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$SOURCE_ASSET" --dir work/source

      - name: Verify and download frozen bounded SEC history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > work/history-manifest.tsv
          rows=[
          (2016,"sec-history-2016-34883719192","sha256:8c3950ea61535bde0fc2301b8f50e167453ae343bbe33743823769d9860b8516"),
          (2017,"sec-history-2017-34883719192","sha256:840fb06dccc99fc10d6600c4c2d190c8cc98f9eb1efa7631169fbe98bd8cc96e"),
          (2018,"sec-history-2018-34883719192","sha256:90725c42243f78d78a5b027400f53038acb6417be06b5d18cb33a3b4446d6390"),
          (2019,"sec-history-2019-34883719192","sha256:c958617c27635cb10c1593bcf3a162ff1252eb02bfdd6f22fa8c9a303538243d"),
          (2020,"sec-history-2020-34883719192","sha256:8f98d1a3d4dbb3400ed3f0165ddc03d46b4e1244ffc6d62863ccf01e63b0a196"),
          (2021,"sec-history-2021-34883719192","sha256:2933bce9d807cd9fa5822ec4c367f061fb8d113e4663b14dd68f185280f86ed0"),
          (2022,"sec-history-2022-34883719192","sha256:c2309d317c4297673e885febf6a80516052772ee63e3d9d3d951dea39c6ddaf4"),
          ]
          for row in rows:
              print("\t".join(map(str,row)))
          PY

          while IFS=$'\t' read -r year artifact digest; do
            actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HISTORY_RUN_ID/artifacts?per_page=100"               --jq ".artifacts[] | select(.name == \"$artifact\") | .digest")
            test "$actual" = "$digest"
            gh run download "$HISTORY_RUN_ID" --repo "$GITHUB_REPOSITORY"               --name "$artifact" --dir "work/history/$year"
          done < work/history-manifest.tsv
          test ! -e work/history/2023

      - name: Build all-Form345 identity corroboration
        run: >-
          uv run python scripts/research_phase1_b3_residual_form345.py
          --source work/source/b3-residual-sec-title-corroboration.json
          --history-root work/history
          --output-dir work/output

      - name: Assert bounded evidence-only result
        run: |
          python - <<'PY'
          import json
          s=json.load(open("work/output/summary.json"))
          assert s["status"]=="B3_RESIDUAL_FORM345_CORROBORATION_COMPLETE"
          assert s["sourceRows"]==162
          assert s["targetIssuers"]==49
          assert s["datePrecision"]=="FILING_DATE_ONLY"
          assert s["performanceRead"] is False
          assert s["priceFieldsRead"]==[]
          assert s["transactionFieldsRead"]==[]
          assert s["oosOpened"] is False
          assert s["productionScoringChanged"] is False
          assert s["continuityStatesChanged"]==0
          assert s["finalResolutionContractCreated"] is False
          assert s["correctedPerformanceOpened"] is False
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Persist Form345 corroboration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Phase-1 B3 residual all-Form345 corroboration v1"               --notes "Bounded 2016-2022 official SEC Form 3/4/5 SUBMISSION identity corroboration. Filing-date-only evidence; no performance, prices, validation or OOS opened."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE"             work/output/b3-residual-form345-corroboration.json             work/output/summary.json             --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: b3-residual-form345-${{ github.run_id }}
          path: work/output
          retention-days: 90
