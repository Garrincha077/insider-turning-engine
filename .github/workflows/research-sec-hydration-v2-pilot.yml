name: Validate historical SEC hydration v2

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research_sec_hydrate.py"
      - ".github/workflows/research-sec-hydration-v2-pilot.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: research-sec-hydration-v2-pilot
  cancel-in-progress: false

env:
  SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
  CANDIDATE_RUN_ID: "34884538222"

jobs:
  pilot:
    name: Rehydrate first 500 original buys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Download 2016 candidate universe
        uses: actions/download-artifact@v4
        with:
          name: sec-candidates-2016-${{ env.CANDIDATE_RUN_ID }}
          path: work/sec-candidates/2016
          repository: ${{ github.repository }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Hydrate 500 with audited legacy-date normalization
        run: >-
          uv run python scripts/research_sec_hydrate.py
          --candidate-path work/sec-candidates/2016/candidates.jsonl
          --output work/sec-hydration-v2
          --year 2016 --quarter 1 --offset 0 --limit 500 --workers 4
          --candidate-run-id "$CANDIDATE_RUN_ID"
      - name: Enforce pilot quality gate
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/sec-hydration-v2/summary.json").read_text())
          assert report["selectedOriginalBuyFilings"] == 500, report
          assert report["matchedInDailyIndex"] == 500, report
          assert report["hydratedAndParsedFilings"] == 500, report
          assert report["failureCount"] == 0, report
          assert report["allCanonicalKnowledgeEqualAccepted"] is True, report
          assert report["legacyDateTransformFilings"] >= 2, report
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-hydration-v2-pilot-${{ github.run_id }}
          path: |
            work/sec-hydration-v2/summary.json
            work/sec-hydration-v2/raw-manifest.jsonl
            work/sec-hydration-v2/canonical-research.jsonl
            work/sec-hydration-v2/failures.jsonl
          if-no-files-found: warn
          retention-days: 90
