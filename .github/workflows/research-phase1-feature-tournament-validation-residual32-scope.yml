name: Freeze F2 validation residual-32 continuity scope

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-phase1-feature-tournament-validation-residual32-scope.yml"
      - "scripts/research_phase1_feature_tournament_validation_residual32_scope.py"
      - "tests/test_research_phase1_feature_tournament_validation_residual32_scope.py"
      - "docs/research-phase1-feature-tournament-validation-residual32-scope-gate.md"

permissions:
  contents: write

concurrency:
  group: research-phase1-feature-tournament-validation-residual32-scope-v1
  cancel-in-progress: true

env:
  SOURCE_RELEASE: research-phase1-insider-feature-tournament-validation-residual33-scope-v1
  SOURCE_ASSET: validation-residual33-scope.json
  SOURCE_DIGEST: sha256:0dab36d7553ec3ceb0838c79cf7ad70a85fa240686d7493930de160c55adb946
  HSDT_RELEASE: research-phase1-insider-feature-tournament-validation-hsdt-primary-resolution-v1
  HSDT_ASSET: validation-hsdt-primary-resolution.json
  HSDT_DIGEST: sha256:b5348aa135082da6a2d07510125ffde4b67b4f327a522597301782d3b2e37a03
  RESULT_RELEASE: research-phase1-insider-feature-tournament-validation-residual32-scope-v1
  RESULT_ASSET: validation-residual32-scope.json

jobs:
  freeze:
    name: Freeze exact 32-row validation continuity residual
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups --frozen

      - name: Lint and test residual-32 scope freezer
        run: |
          uv run ruff check scripts/research_phase1_feature_tournament_validation_residual32_scope.py tests/test_research_phase1_feature_tournament_validation_residual32_scope.py
          uv run pytest -q tests/test_research_phase1_feature_tournament_validation_residual32_scope.py

      - name: Download and verify immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/input work/output

          gh release download "$SOURCE_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$SOURCE_ASSET" --dir work/input
          test "sha256:$(sha256sum "work/input/$SOURCE_ASSET" | cut -d' ' -f1)" = "$SOURCE_DIGEST"

          gh release download "$HSDT_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$HSDT_ASSET" --dir work/input
          test "sha256:$(sha256sum "work/input/$HSDT_ASSET" | cut -d' ' -f1)" = "$HSDT_DIGEST"

      - name: Freeze exact residual-32 scope
        run: >-
          uv run python
          scripts/research_phase1_feature_tournament_validation_residual32_scope.py
          --source "work/input/$SOURCE_ASSET"
          --resolution "work/input/$HSDT_ASSET"
          --output "work/output/$RESULT_ASSET"

      - name: Assert frozen residual and wave partition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("work/output/validation-residual32-scope.json").read_text())
          assert p["status"]=="PHASE1_FEATURE_TOURNAMENT_VALIDATION_RESIDUAL32_SCOPE_FROZEN"
          assert p["sourceResidualRows"]==33
          assert p["subtractedHSDTRows"]==1
          assert p["residualRows"]==32
          assert p["scopeKeySha256"]=="sha256:4b8d0df8ff1d06f018fdcbdf281b9fa2be05f21e77b57682012b36b419049e34"
          assert p["categoryCounts"]=={
              "LONG_GAP_NEW_PRIMARY_EVIDENCE_REQUIRED":10,
              "PROVIDER_NEW_PRIMARY_EVIDENCE_REQUIRED":22,
          }
          assert p["waveCounts"]=={
              "stockDividendRows":5,
              "incompleteStockMergerRows":8,
              "nameChangeStockMergerRows":8,
              "standaloneNameChangeRows":1,
              "longGapRows":10,
          }
          assert len(p["rows"])==32
          assert p["performanceRead"] is False
          assert p["priceFieldsRead"]==[]
          assert p["featureOutcomesRead"] is False
          assert p["validationOpened"] is False
          assert p["validationPerformanceOpened"] is False
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          PY

      - name: Publish immutable residual-32 scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Phase-1 F2 validation residual-32 continuity scope v1"               --notes "Performance-blind subtraction of the HSDT primary continuity resolution from residual-33. 32 rows remain in frozen primary-evidence waves; validation performance and 2023+ OOS remain closed."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE" "work/output/$RESULT_ASSET"             --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: phase1-insider-feature-tournament-validation-residual32-scope-${{ github.run_id }}
          path: work/output
          retention-days: 90
