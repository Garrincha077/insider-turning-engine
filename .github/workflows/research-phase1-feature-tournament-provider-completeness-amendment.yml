name: Freeze feature tournament provider completeness amendment

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-phase1-feature-tournament-provider-completeness-amendment.yml"
      - "scripts/research_phase1_feature_tournament_provider_completeness_amendment.py"
      - "tests/test_research_phase1_feature_tournament_provider_completeness_amendment.py"
      - "research/phase1-feature-tournament-provider-completeness-primary-evidence-v1.json"
      - "docs/research-phase1-feature-tournament-provider-completeness-amendment-gate.md"

permissions:
  contents: write

concurrency:
  group: research-phase1-feature-tournament-provider-completeness-amendment-v1
  cancel-in-progress: false

env:
  AUDIT_RELEASE: research-phase1-feature-tournament-stage-b-continuity-audit-v1
  AUDIT_ASSET: feature-tournament-stage-b-continuity-audit-v1.tar.gz
  AUDIT_DIGEST: sha256:77066ec138f53c0572a206559294768c6c898270ba6dcc3b2429ac7ddddab88f
  EVIDENCE_PATH: research/phase1-feature-tournament-provider-completeness-primary-evidence-v1.json
  EVIDENCE_BLOB: 3b6a4c9976f769fc5cd7a67f97e1b18f7fee65b6
  RESULT_RELEASE: research-phase1-feature-tournament-provider-completeness-amendment-v1

jobs:
  amend:
    name: Primary-evidence provider completeness amendment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups --frozen

      - name: Verify frozen primary evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$EVIDENCE_PATH"
          test "$(git hash-object "$EVIDENCE_PATH")" = "$EVIDENCE_BLOB"

      - name: Lint and test amendment semantics
        run: |
          uv run ruff check scripts/research_phase1_feature_tournament_provider_completeness_amendment.py tests/test_research_phase1_feature_tournament_provider_completeness_amendment.py
          uv run pytest -q tests/test_research_phase1_feature_tournament_provider_completeness_amendment.py

      - name: Download and verify frozen Stage-B ledger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source work/output
          gh release download "$AUDIT_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$AUDIT_ASSET" --dir work/source
          test "sha256:$(sha256sum "work/source/$AUDIT_ASSET" | cut -d' ' -f1)" = "$AUDIT_DIGEST"
          tar -xzf "work/source/$AUDIT_ASSET" -C work/source             ledger/continuity-ledger.csv ledger/summary.json
          test -s work/source/ledger/continuity-ledger.csv
          python - <<'PY'
          import json
          s=json.load(open("work/source/ledger/summary.json"))
          assert s["eventHorizonRows"]==96760
          assert s["unresolvedEventHorizonRows"]==210
          assert s["performanceRead"] is False
          assert s["oosOpened"] is False
          PY

      - name: Build exact 13-row provider completeness overlay
        run: >-
          uv run python
          scripts/research_phase1_feature_tournament_provider_completeness_amendment.py
          --ledger work/source/ledger/continuity-ledger.csv
          --evidence "$EVIDENCE_PATH"
          --output work/output/provider-completeness-amendment.json

      - name: Assert immutable amendment boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          p=json.load(open("work/output/provider-completeness-amendment.json"))
          assert p["status"]=="PHASE1_FEATURE_TOURNAMENT_PROVIDER_COMPLETENESS_AMENDMENT_COMPLETE"
          assert p["sourceLedgerRows"]==96760
          assert p["amendedRows"]==13
          assert p["amendedEvents"]==7
          assert p["amendedActions"]==4
          assert p["discoveryOverlapRows"]==0
          assert p["validationEventRows"]==0
          assert p["tickerCounts"]=={
              "MGYR":1,
              "PAAC":3,
              "QES":4,
              "WSTL":5,
          }
          assert p["performanceRead"] is False
          assert p["priceFieldsRead"]==[]
          assert p["featureOutcomesRead"] is False
          assert p["confirmationOutcomesOpened"] is False
          assert p["validationOpened"] is False
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          assert p["finalStageB210ContractMutated"] is False
          assert p["overlayRequiredForPerformanceValuation"] is True

          qes=[r for r in p["resolutionRows"] if r["ticker"]=="QES"]
          assert len(qes)==4
          assert {r["successorSymbol"] for r in qes}=={"KLXE"}
          assert {r["successorSharesPerEntryShare"] for r in qes}=={0.0969}

          wstl=[r for r in p["resolutionRows"] if r["ticker"]=="WSTL"]
          assert len(wstl)==5
          assert {r["cashPerEntryShare"] for r in wstl}=={1.48}
          assert {r["holderPolicy"] for r in wstl}=={"ONE_ENTRY_SHARE"}

          paac=[r for r in p["resolutionRows"] if r["ticker"]=="PAAC"]
          assert len(paac)==3
          assert {r["successorSymbol"] for r in paac}=={"LGHL"}
          assert {r["successorSharesPerEntryShare"] for r in paac}=={1.0}

          mgyr=[r for r in p["resolutionRows"] if r["ticker"]=="MGYR"]
          assert len(mgyr)==1
          assert mgyr[0]["successorSymbol"]=="MGYR"
          assert mgyr[0]["successorSharesPerEntryShare"]==1.2213

          print(json.dumps({
              "amendedRows":p["amendedRows"],
              "amendedEvents":p["amendedEvents"],
              "tickerCounts":p["tickerCounts"],
              "amendmentKeySha256":p["amendmentKeySha256"],
          },indent=2,sort_keys=True))
          PY

      - name: Publish immutable provider completeness amendment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Phase-1 feature tournament provider completeness amendment v1"               --notes "Primary-evidence 13-row overlay for four initially classified provider stock-merger actions with incomplete successor semantics. Zero discovery or validation-event overlap; no feature outcomes opened."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE"             work/output/provider-completeness-amendment.json             --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: feature-tournament-provider-completeness-amendment-${{ github.run_id }}
          path: work/output/provider-completeness-amendment.json
          retention-days: 90
