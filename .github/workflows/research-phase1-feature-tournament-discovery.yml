name: Run insider feature tournament discovery

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-phase1-feature-tournament-discovery.yml"
      - "scripts/research_phase1_feature_tournament_discovery.py"
      - "tests/test_research_phase1_feature_tournament_discovery.py"
      - "docs/research-phase1-feature-tournament-discovery-gate.md"

permissions:
  contents: write

concurrency:
  group: research-phase1-feature-tournament-discovery-v1
  cancel-in-progress: false

env:
  STAGE_A_RELEASE: research-phase1-insider-feature-tournament-stage-a-v1
  STAGE_A_ASSET: phase1-insider-feature-tournament-stage-a-v1.tar.gz
  STAGE_A_DIGEST: sha256:06bd11f7ea2352d95e0b3bcdb997af869b6b020c46c224e5ac942bb9a0eccb0d

  CONTINUITY_AUDIT_RELEASE: research-phase1-feature-tournament-stage-b-continuity-audit-v1
  CONTINUITY_AUDIT_ASSET: feature-tournament-stage-b-continuity-audit-v1.tar.gz
  CONTINUITY_AUDIT_DIGEST: sha256:77066ec138f53c0572a206559294768c6c898270ba6dcc3b2429ac7ddddab88f

  FINAL_CONTINUITY_RELEASE: research-phase1-feature-tournament-stage-b-final-continuity-v1
  FINAL_CONTINUITY_ASSET: stage-b-final-continuity.json
  FINAL_CONTINUITY_DIGEST: sha256:24947122c8fa776dc6f5e8f628c5b45cdbec6551cf15df334421b405439b4518

  MARKET_RELEASE: research-market-alpaca-v1

  BASELINE_RELEASE: research-phase1-baselines-v1
  B1_ASSET: b1-events.csv
  B1_DIGEST: sha256:7f0da85bb561e0457ed85249376bb4fca1a0a7e996f424d81e23813b5ad6bbdb
  B2_ASSET: b2-events.csv
  B2_DIGEST: sha256:1d905cac1fd10a1051c4f0734fac5247a7a61a114a5baf29a42a395a361f1688
  B4_ASSET: b4-events.csv
  B4_DIGEST: sha256:dd8ea0454e9a608ba42b11fc393fa93ad83c3f0eedd04d9e5dee5624abb0ee7f

  B3_RELEASE: research-phase1-b3-continuity-corrected-development-v1
  B3_ASSET: b3-continuity-corrected-development-2016-2020.tar.gz
  B3_DIGEST: sha256:b7b058a2e82cb072876804178e9af6e247fa9dc70b6f93a3f3c8e32ffe67c8be

  RESULT_RELEASE: research-phase1-insider-feature-tournament-discovery-v1

jobs:
  discovery:
    name: Frozen 2016-2018 discovery selection
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups --frozen

      - name: Lint and test discovery semantics
        run: |
          uv run ruff check scripts/research_phase1_feature_tournament_discovery.py tests/test_research_phase1_feature_tournament_discovery.py
          uv run pytest -q tests/test_research_phase1_feature_tournament_discovery.py

      - name: Download and verify frozen Stage A
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/download/stage-a work/stage-a
          gh release download "$STAGE_A_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$STAGE_A_ASSET" --dir work/download/stage-a
          test "sha256:$(sha256sum "work/download/stage-a/$STAGE_A_ASSET" | cut -d' ' -f1)" = "$STAGE_A_DIGEST"
          tar -xzf "work/download/stage-a/$STAGE_A_ASSET" -C work/stage-a             summary.json stage-a-feature-matrix.csv stage-a-cutpoints.json
          test -s work/stage-a/summary.json
          test -s work/stage-a/stage-a-feature-matrix.csv
          test -s work/stage-a/stage-a-cutpoints.json

      - name: Download and verify continuity sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/download/continuity work/continuity

          gh release download "$CONTINUITY_AUDIT_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$CONTINUITY_AUDIT_ASSET" --dir work/download/continuity
          test "sha256:$(sha256sum "work/download/continuity/$CONTINUITY_AUDIT_ASSET" | cut -d' ' -f1)" = "$CONTINUITY_AUDIT_DIGEST"
          tar -xzf "work/download/continuity/$CONTINUITY_AUDIT_ASSET"             -C work/continuity             ledger/continuity-ledger.csv ca/corporate-actions.json
          test -s work/continuity/ledger/continuity-ledger.csv
          test -s work/continuity/ca/corporate-actions.json

          gh release download "$FINAL_CONTINUITY_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$FINAL_CONTINUITY_ASSET" --dir work/continuity
          test "sha256:$(sha256sum "work/continuity/$FINAL_CONTINUITY_ASSET" | cut -d' ' -f1)" = "$FINAL_CONTINUITY_DIGEST"

      - name: Download and verify discovery-only market years
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/download/market work/market
          declare -A DIGESTS=(
            [2016]=df531881b67f9f42e40b2c2fff03f6ca19c0b5f9b13deb6190132b7987fb69ca
            [2017]=7515a3807249bbead7cf7edc2a2aa1d267b01fc49ddf72885c40746520e762d0
            [2018]=4a99eafc6cac31ee30d23bf82c1feccb4bbe14919f7c4df2d59e792f8a5b2f54
            [2019]=c701d559a7d5128fd07ec19e2d5d3b39eb5ae8c0d9bd51a8b278d34c9b6f9238
            [2020]=5577a548576e81c5e468b9e5027c9a8ec1ba8e1dd14ed38a0f223e797c5358e2
          )
          for year in 2016 2017 2018 2019 2020; do
            asset="alpaca-market-$year.tar.gz"
            gh release download "$MARKET_RELEASE" --repo "$GITHUB_REPOSITORY"               --pattern "$asset" --dir work/download/market
            test "$(sha256sum "work/download/market/$asset" | cut -d' ' -f1)" = "${DIGESTS[$year]}"
            mkdir -p "work/market/$year"
            tar -xzf "work/download/market/$asset" -C "work/market/$year"               "canonical-market-$year.csv"
            test -s "work/market/$year/canonical-market-$year.csv"
          done
          test ! -e work/market/2021
          test ! -e work/market/2022
          test ! -e work/market/2023

      - name: Download and verify frozen benchmark overlap sets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/benchmarks work/download/b3 work/b3

          for spec in             "$B1_ASSET:$B1_DIGEST"             "$B2_ASSET:$B2_DIGEST"             "$B4_ASSET:$B4_DIGEST"; do
            asset="${spec%%:*}"
            digest="${spec#*:}"
            gh release download "$BASELINE_RELEASE" --repo "$GITHUB_REPOSITORY"               --pattern "$asset" --dir work/benchmarks
            test "sha256:$(sha256sum "work/benchmarks/$asset" | cut -d' ' -f1)" = "$digest"
          done

          gh release download "$B3_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$B3_ASSET" --dir work/download/b3
          test "sha256:$(sha256sum "work/download/b3/$B3_ASSET" | cut -d' ' -f1)" = "$B3_DIGEST"
          tar -xzf "work/download/b3/$B3_ASSET" -C work/b3             b3-continuity-corrected-events.csv
          test -s work/b3/b3-continuity-corrected-events.csv

      - name: Assert discovery boundary before outcome read
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json

          s=json.load(open("work/stage-a/summary.json"))
          assert s["forwardReturnsRead"] is False
          assert s["validationOpened"] is False
          assert s["oosOpened"] is False

          c=json.load(open("work/continuity/stage-b-final-continuity.json"))
          assert c["classifiedRows"]==210
          assert c["unresolvedRows"]==0
          assert c["featureOutcomesRead"] is False
          assert c["validationOpened"] is False
          assert c["oosOpened"] is False

          with open("work/stage-a/stage-a-feature-matrix.csv", newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==24190
          assert any(r["evaluationSession"] >= "2019-01-01" for r in rows)
          PY

      - name: Run frozen 2016-2018 discovery tournament
        run: >-
          uv run python scripts/research_phase1_feature_tournament_discovery.py
          --stage-a-dir work/stage-a
          --ledger work/continuity/ledger/continuity-ledger.csv
          --corporate-actions work/continuity/ca/corporate-actions.json
          --final-contract work/continuity/stage-b-final-continuity.json
          --market-root work/market
          --b1-events work/benchmarks/b1-events.csv
          --b2-events work/benchmarks/b2-events.csv
          --b3-events work/b3/b3-continuity-corrected-events.csv
          --b4-events work/benchmarks/b4-events.csv
          --output work/output

      - name: Assert discovery-only output and frozen selection boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json

          p=json.load(open("work/output/discovery-results.json"))
          assert p["status"]=="PHASE1_INSIDER_FEATURE_TOURNAMENT_DISCOVERY_COMPLETE"
          assert p["definitionId"]=="PHASE1_INSIDER_FEATURE_TOURNAMENT_V1"
          assert p["sourceStageAEvents"]==24190
          assert p["primaryHorizonSessions"]==126
          assert p["variantCount"]==18
          assert set(p["familyCandidates"])=={"F1","F2","F3","F4"}
          assert 0 <= p["familyCandidateCount"] <= 4
          assert p["confirmationOpened"] is False
          assert p["validationOpened"] is False
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          assert p["compositeWeightsFit"] is False
          assert p["newVariantsAdded"] is False

          with open("work/output/discovery-event-outcomes.csv", newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==p["discoveryEvents"]
          assert rows
          assert max(r["evaluationSession"] for r in rows) <= "2018-12-31"
          assert not any(r["evaluationSession"] >= "2019-01-01" for r in rows)

          print(json.dumps({
              "discoveryEvents":p["discoveryEvents"],
              "discoveryDistinctIssuers":p["discoveryDistinctIssuers"],
              "familyCandidateCount":p["familyCandidateCount"],
              "familyCandidates":p["familyCandidates"],
              "maturity":p["maturity"],
          },indent=2,sort_keys=True))
          PY

      - name: Publish immutable discovery result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp docs/research-phase1-feature-tournament-discovery-gate.md work/output/
          tar -C work/output -czf work/phase1-insider-feature-tournament-discovery-v1.tar.gz             discovery-results.json             discovery-event-outcomes.csv             research-phase1-feature-tournament-discovery-gate.md

          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Phase-1 insider feature tournament discovery v1"               --notes "Frozen 2016-2018 discovery selection from the zero-unresolved Stage-B continuity contract. 2019-2020 confirmation, 2021-2022 validation and 2023+ OOS remain closed."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE"             work/phase1-insider-feature-tournament-discovery-v1.tar.gz             work/output/discovery-results.json             --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: phase1-insider-feature-tournament-discovery-${{ github.run_id }}
          path: work/output
          retention-days: 90
