name: Resolve B3 one-sided identity rows from primary SEC evidence

on:
  push:
    branches:
      - research/b3-ps-pit-history
    paths:
      - "research/b3-one-sided-primary-evidence-v1.json"
      - "scripts/research_phase1_b3_one_sided_primary_resolution.py"
      - "tests/test_research_phase1_b3_one_sided_primary_resolution.py"
      - "docs/research-phase1-b3-one-sided-primary-resolution-gate.md"
      - ".github/workflows/research-phase1-b3-one-sided-primary-resolution.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    env:
      SCOPE_RELEASE: research-phase1-b3-residual83-scope-v1
      SCOPE_ASSET: b3-residual83-scope.json
      SCOPE_ASSET_DIGEST: sha256:fa2818a00fa299b9838e6f45e2dab04d4da5512b7b4d8f71393908caf53ce7bc
      RESOLUTION_KEY_DIGEST: sha256:6380297ba23e117849914bb4e2f9e1956a53c22c65a6514d99e992537294861f
      RESULT_RELEASE: research-phase1-b3-one-sided-primary-resolution-v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --all-groups --frozen

      - name: Lint one-sided resolver
        run: >-
          uv run ruff check
          scripts/research_phase1_b3_one_sided_primary_resolution.py
          tests/test_research_phase1_b3_one_sided_primary_resolution.py

      - name: Test one-sided resolution semantics
        run: >-
          uv run pytest -q
          tests/test_research_phase1_b3_one_sided_primary_resolution.py

      - name: Download exact frozen residual-83 scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/scope work/output
          gh release download "$SCOPE_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SCOPE_ASSET" --dir work/scope
          digest="sha256:$(sha256sum "work/scope/$SCOPE_ASSET" | cut -d' ' -f1)"
          test "$digest" = "$SCOPE_ASSET_DIGEST"

      - name: Resolve exact one-sided identity rows
        run: >-
          uv run python scripts/research_phase1_b3_one_sided_primary_resolution.py
          --scope "work/scope/$SCOPE_ASSET"
          --evidence research/b3-one-sided-primary-evidence-v1.json
          --output work/output/b3-one-sided-primary-resolution.json

      - name: Assert frozen one-sided resolution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(
              Path("work/output/b3-one-sided-primary-resolution.json").read_text()
          )
          assert p["status"] == "B3_ONE_SIDED_PRIMARY_RESOLUTION_COMPLETE"
          assert p["sourceResidualRows"] == 83
          assert p["resolvedRows"] == 20
          assert p["remainingResidualRowsBeforeOtherRules"] == 63
          assert p["resolutionKeySha256"] == os.environ["RESOLUTION_KEY_DIGEST"]
          assert p["resolutionDecisionCounts"] == {
              "SAME_SECURITY_CONTINUITY": 12,
              "TRANSFORMED_HOLDER_CONSIDERATION": 8,
          }
          assert p["resultStateCounts"] == {
              "PRICE_CONTINUOUS_ADJUSTED": 12,
              "TRANSFORMED_HOLDER_CONSIDERATION": 8,
          }

          lov = [r for r in p["resolutionRows"] if r["ticker"] == "LOV"]
          bv = [r for r in p["resolutionRows"] if r["ticker"] == "BV"]
          assert len(lov) == 7
          assert len(bv) == 1
          assert all(r["successorSharesPerEntryShare"] == 0.1 for r in lov)
          assert all(r["successorIssuerCik"] == "0001705338" for r in lov)
          assert bv[0]["cashPerEntryShare"] == 5.5
          assert bv[0]["successorSharesPerEntryShare"] == 0.0

          assert p["performanceRead"] is False
          assert p["priceFieldsRead"] == []
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          assert p["finalResolutionContractCreated"] is False
          assert p["correctedPerformanceOpened"] is False
          print(json.dumps({
              "resolvedRows": p["resolvedRows"],
              "remainingResidualRowsBeforeOtherRules":
                  p["remainingResidualRowsBeforeOtherRules"],
              "resolutionKeySha256": p["resolutionKeySha256"],
              "resolutionDecisionCounts": p["resolutionDecisionCounts"],
          }, indent=2, sort_keys=True))
          PY

      - name: Publish immutable one-sided resolution release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --title "Phase-1 B3 one-sided primary resolution v1" \
              --notes "Performance-blind identity-specific resolution of the frozen 20-row one-sided P/S bucket. Corrected performance and 2023+ OOS remain closed." \
              --prerelease
          fi
          gh release upload "$RESULT_RELEASE" \
            work/output/b3-one-sided-primary-resolution.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: b3-one-sided-primary-resolution-${{ github.run_id }}
          path: work/output/b3-one-sided-primary-resolution.json
          retention-days: 90
