name: Freeze B3 residual-24 continuity scope

on:
  push:
    branches:
      - research/b3-ps-pit-history
    paths:
      - "scripts/research_phase1_b3_residual24_scope.py"
      - "tests/test_research_phase1_b3_residual24_scope.py"
      - "docs/research-phase1-b3-residual24-scope-gate.md"
      - ".github/workflows/research-phase1-b3-residual24-scope.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    env:
      SCOPE43_RELEASE: research-phase1-b3-residual43-scope-v1
      SCOPE43_ASSET: b3-residual43-scope.json
      SCOPE43_ASSET_DIGEST: sha256:eeb929e959cfe606764d251ad9f9a262c80336e79f395a6c701b84fdbed4cbe3
      COMMON_RELEASE: research-phase1-b3-common-security-primary-resolution-v1
      COMMON_ASSET: b3-common-security-primary-resolution.json
      COMMON_ASSET_DIGEST: sha256:fec6e91a78c665686d5a00baa1baef9a9c6493c4bf53841e8b39bc0e20cc2ac4
      RESIDUAL24_KEY_DIGEST: sha256:cd190ed2cfbd8147b5f8c3b3c3f562e4b20093e775b88dfc9a6f0f57dc1167f5
      RESULT_RELEASE: research-phase1-b3-residual24-scope-v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --all-groups --frozen

      - name: Lint residual-24 scope implementation
        run: >-
          uv run ruff check
          scripts/research_phase1_b3_residual24_scope.py
          tests/test_research_phase1_b3_residual24_scope.py

      - name: Test residual-24 scope semantics
        run: >-
          uv run pytest -q
          tests/test_research_phase1_b3_residual24_scope.py

      - name: Download pinned sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/scope43 work/common work/output
          gh release download "$SCOPE43_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SCOPE43_ASSET" --dir work/scope43
          gh release download "$COMMON_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$COMMON_ASSET" --dir work/common

          d1="sha256:$(sha256sum "work/scope43/$SCOPE43_ASSET" | cut -d' ' -f1)"
          d2="sha256:$(sha256sum "work/common/$COMMON_ASSET" | cut -d' ' -f1)"
          test "$d1" = "$SCOPE43_ASSET_DIGEST"
          test "$d2" = "$COMMON_ASSET_DIGEST"

      - name: Freeze exact residual-24 scope
        run: >-
          uv run python scripts/research_phase1_b3_residual24_scope.py
          --scope "work/scope43/$SCOPE43_ASSET"
          --common-resolution "work/common/$COMMON_ASSET"
          --output work/output/b3-residual24-scope.json

      - name: Assert immutable residual-24 boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(Path("work/output/b3-residual24-scope.json").read_text())
          assert p["status"] == "B3_RESIDUAL24_SCOPE_FROZEN"
          assert p["sourceRows"] == 43
          assert p["subtractedCommonRows"] == 19
          assert p["residualRows"] == 24
          assert p["uniqueIssuerTickerPairs"] == 12
          assert p["residualKeySha256"] == os.environ["RESIDUAL24_KEY_DIGEST"]
          assert p["performanceRead"] is False
          assert p["priceFieldsRead"] == []
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          assert p["autoExpansionAllowed"] is False
          assert p["finalResolutionContractCreated"] is False
          assert p["correctedPerformanceOpened"] is False
          print(json.dumps({
              "residualRows": p["residualRows"],
              "uniqueIssuerTickerPairs": p["uniqueIssuerTickerPairs"],
              "residualKeySha256": p["residualKeySha256"],
              "evidenceBucketCounts": p["evidenceBucketCounts"],
          }, indent=2, sort_keys=True))
          PY

      - name: Publish immutable residual-24 scope release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --title "Phase-1 B3 residual-24 continuity scope v1" \
              --notes "Exact performance-blind residual continuity queue after the 19-row ordinary common-security resolution. Corrected performance and 2023+ OOS remain closed." \
              --prerelease
          fi
          gh release upload "$RESULT_RELEASE" \
            work/output/b3-residual24-scope.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: b3-residual24-scope-${{ github.run_id }}
          path: work/output/b3-residual24-scope.json
          retention-days: 90
