name: Diagnose F2 validation exact long gaps

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-phase1-feature-tournament-validation-gap-diagnostics.yml"
      - "scripts/research_phase1_security_gap_diagnostics.py"
      - "tests/test_research_phase1_security_gap_diagnostics.py"
      - "docs/research-phase1-feature-tournament-validation-gap-diagnostics-gate.md"

permissions:
  contents: write

concurrency:
  group: research-phase1-feature-tournament-validation-gap-diagnostics-v1
  cancel-in-progress: true

env:
  AUDIT_RELEASE: research-phase1-insider-feature-tournament-validation-continuity-audit-v1
  AUDIT_ARCHIVE: phase1-insider-feature-tournament-validation-continuity-audit-v1.tar.gz
  AUDIT_DIGEST: sha256:e1e34180cbd8e115412d88e75abc39711b1645515396b4f6bb52b19a6d7716d5
  MARKET_RELEASE: research-market-alpaca-v1
  RESULT_RELEASE: research-phase1-insider-feature-tournament-validation-gap-diagnostics-v1

jobs:
  diagnose:
    name: Performance-blind validation long-gap diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups --frozen

      - name: Lint and test frozen gap diagnostics
        run: |
          uv run ruff check scripts/research_phase1_security_gap_diagnostics.py tests/test_research_phase1_security_gap_diagnostics.py
          uv run pytest -q tests/test_research_phase1_security_gap_diagnostics.py

      - name: Download and verify validation continuity audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/download/audit work/audit work/download/market work/market work/gaps
          gh release download "$AUDIT_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$AUDIT_ARCHIVE" --dir work/download/audit
          test "sha256:$(sha256sum "work/download/audit/$AUDIT_ARCHIVE" | cut -d' ' -f1)" = "$AUDIT_DIGEST"
          tar -xzf "work/download/audit/$AUDIT_ARCHIVE" -C work/audit             validation-continuity-audit.csv summary.json
          test -s work/audit/validation-continuity-audit.csv
          python - <<'PY'
          import json
          p=json.load(open("work/audit/summary.json"))
          assert p["unresolvedRows"]==41
          assert p["longGapRows"]==11
          assert p["performanceRead"] is False
          assert p["featureOutcomesRead"] is False
          assert p["validationOpened"] is False
          assert p["oosOpened"] is False
          PY

      - name: Download and verify frozen pre-2023 market-presence corpus
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A DIGESTS=(
            [2016]=df531881b67f9f42e40b2c2fff03f6ca19c0b5f9b13deb6190132b7987fb69ca
            [2017]=7515a3807249bbead7cf7edc2a2aa1d267b01fc49ddf72885c40746520e762d0
            [2018]=4a99eafc6cac31ee30d23bf82c1feccb4bbe14919f7c4df2d59e792f8a5b2f54
            [2019]=c701d559a7d5128fd07ec19e2d5d3b39eb5ae8c0d9bd51a8b278d34c9b6f9238
            [2020]=5577a548576e81c5e468b9e5027c9a8ec1ba8e1dd14ed38a0f223e797c5358e2
            [2021]=550ff3456ad16a045692a5d9d567d13ef2b8788283f4c39c3baa5d8aecd7a704
            [2022]=8a71037090cda77bc3937409ffa9fcb9c463545b5f3a7d9a73995a92759d187a
          )
          for year in 2016 2017 2018 2019 2020 2021 2022; do
            asset="alpaca-market-$year.tar.gz"
            gh release download "$MARKET_RELEASE" --repo "$GITHUB_REPOSITORY"               --pattern "$asset" --dir work/download/market
            test "$(sha256sum "work/download/market/$asset" | cut -d' ' -f1)" = "${DIGESTS[$year]}"
            mkdir -p "work/market/$year"
            tar -xzf "work/download/market/$asset" -C "work/market/$year"               "canonical-market-$year.csv"
          done
          test ! -e work/market/2023

      - name: Recompute exact validation gap intervals
        run: >-
          uv run python scripts/research_phase1_security_gap_diagnostics.py
          --ledger work/audit/validation-continuity-audit.csv
          --market-root work/market
          --output-dir work/gaps

      - name: Assert exact 11-row diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json

          s=json.load(open("work/gaps/summary.json"))
          assert s["status"]=="PHASE1_FROZEN_LONG_GAP_DIAGNOSTICS_COMPLETE"
          assert s["gapEventHorizonRows"]==11
          assert s["allGapsBracketedByObservedBars"] is True
          assert s["priceFieldsRead"]==[]
          assert s["performanceRead"] is False
          assert s["researchOnly"] is True
          assert s["oosOpened"] is False
          assert s["productionScoringChanged"] is False

          with open("work/gaps/gap-diagnostics.csv", newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==11
          hsdt=[r for r in rows if r["ticker"]=="HSDT"]
          assert len(hsdt)==1
          assert hsdt[0]["eventNumber"]=="3657"
          assert hsdt[0]["maxInternalGapSessions"]=="29"
          PY

      - name: Publish immutable validation gap diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp docs/research-phase1-feature-tournament-validation-gap-diagnostics-gate.md work/gaps/
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Phase-1 F2 validation exact gap diagnostics v1"               --notes "Exact XNYS missing-session intervals for the 11 frozen validation long-gap rows. Presence-only evidence; validation outcomes and 2023+ OOS remain closed."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE"             work/gaps/gap-diagnostics.csv             work/gaps/summary.json             --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: phase1-insider-feature-tournament-validation-gap-diagnostics-${{ github.run_id }}
          path: work/gaps
          retention-days: 90
