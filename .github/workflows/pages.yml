name: Deploy dashboard

on:
  push:
    branches: [main, codex/luna-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Resolve GitHub Pages base path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=$repository_name" >> "$GITHUB_ENV"
          fi
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Validate atomic dashboard snapshot
        shell: bash
        run: |
          test -s app/dist/index.html
          test -s app/dist/data/dashboard.json
          test -s app/dist/data/manifest.json
          uv run python - <<'PY'
          from pathlib import Path

          from insider_turning_engine.export import (
              dashboard_publication_policy,
              validate_dashboard_directory,
          )

          manifest = validate_dashboard_directory(Path("app/dist/data"))
          publishable, _ = dashboard_publication_policy(manifest)
          if not publishable:
              raise SystemExit("dashboard artifact does not satisfy Pages publication policy")
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
