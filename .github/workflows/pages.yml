name: Deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    # One daily graph: restore -> SEC -> market -> snapshot -> Pages (digest separate gate).
    - cron: "15 7 * * 2-6"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh canonical daily research (otherwise preserve published source dates)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-research-pipeline
  cancel-in-progress: false

env:
  SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # immutable normalized Releases and small allow-listed operational state
      pages: write
      id-token: write
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Restore durable delivery and score state
        id: state
        shell: bash
        run: |
          uv run python -m insider_turning_engine.notifications.state_store restore
          echo "head=$(git -C work/notification-state rev-parse --verify HEAD 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: Preserve published data for UI-only deploys
        if: github.event_name != 'schedule' && inputs.refresh_data != true
        run: >-
          uv run python -m insider_turning_engine.export.restore
          --output app/public/data
      - name: Require an identifying SEC User-Agent
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SEC_USER_AGENT:-}" || {
            echo "SEC_USER_AGENT repository variable is required"
            exit 1
          }
      - uses: actions/cache@v4
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        with:
          path: work/daily-research/market
          key: daily-market-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: daily-market-v2-${{ runner.os }}-
      - name: Acquire latest SEC days and materialize canonical daily research
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python -m insider_turning_engine.pipeline.daily_research
          --output app/public/data
          --work work/daily-research
          --prior-state work/notification-state/prior-states.json
          --repository "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --execute
      - name: Persist state only after verified immutable snapshot storage
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        env:
          EXPECTED_STATE_HEAD: ${{ steps.state.outputs.head }}
        run: >-
          uv run python -m insider_turning_engine.notifications.state_store sync
          --store work/research-state-commit
          --incoming work/daily-research/incoming-state
          --expected-head "$EXPECTED_STATE_HEAD"
      - name: Preserve compact acquisition and daily diagnostics
        if: always() && (github.event_name == 'schedule' || inputs.refresh_data == true)
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/daily-research/identities/identity-manifest.json
            work/daily-research/acquisition/acquisition-status.json
            work/daily-research/daily-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Export masked operational settings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: >-
          uv run insider-turning export-settings-status
          --manifest app/public/data/manifest.json
          --output work/settings-status.json
          --outbox work/alerts.sqlite --environment production
      - name: Attach status atomically without changing source timestamps
        run: >-
          uv run python -m insider_turning_engine.export.settings
          --directory app/public/data --settings work/settings-status.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Resolve GitHub Pages base path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=$repository_name" >> "$GITHUB_ENV"
          fi
      - run: npm ci
        working-directory: app
      - run: npm run lint && npm run typecheck
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e
        working-directory: app
        env:
          PAGES_BASE_PATH: ''
      - run: npm run build
        working-directory: app
      - name: Validate atomic live snapshot and publication policy
        shell: bash
        run: |
          test -s app/dist/index.html
          test -s app/dist/data/dashboard.json
          test -s app/dist/data/manifest.json
          uv run python -m insider_turning_engine.export.research_policy --directory app/dist/data
      - name: Preserve exact validated inputs for the post-deploy factual digest
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        uses: actions/upload-artifact@v4
        with:
          name: digest-publication-${{ github.run_id }}
          path: app/dist/data
          retention-days: 7
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4

  digest:
    # UI-only deploys and reruns never initiate real delivery. No predictive gate bypass.
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'schedule' || inputs.refresh_data == true)
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write # persist a day claim before contacting Telegram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: digest-publication-${{ github.run_id }}
          path: work/digest-publication
      - name: Offline factual preview without credentials
        run: >-
          uv run python -m insider_turning_engine.notifications.digest_cli
          --directory work/digest-publication --output work/digest-preview.json
      - name: Recheck factual gates and persist claim before delivery
        env:
          ITE_ENVIRONMENT: production
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          uv run python -m insider_turning_engine.notifications.digest_cli
          --directory work/digest-publication --execute
      - name: Preserve safe factual-delivery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factual-digest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/digest-preview.json
            work/digest-status.json
          if-no-files-found: warn
          retention-days: 30
