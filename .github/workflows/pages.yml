name: Deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * 2-6"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh the experimental SEC/market snapshot (otherwise preserve source dates)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Preserve published data for UI-only deploys
        if: github.event_name != 'schedule' && inputs.refresh_data != true
        run: >-
          uv run python -m insider_turning_engine.export.restore
          --output app/public/data
      - name: Require an identifying SEC User-Agent
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SEC_USER_AGENT:-}" || {
            echo "SEC_USER_AGENT repository variable is required"
            exit 1
          }
      - name: Build real-data live experimental snapshot
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        run: >-
          uv run python -m insider_turning_engine.pipeline.live_experimental
          --output app/public/data
          --cache-dir data/cache/live-experimental
          --lookback-business-days 1
          --max-symbols 0
          --execute
      - name: Export masked operational settings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: >-
          uv run insider-turning export-settings-status
          --manifest app/public/data/manifest.json
          --output work/settings-status.json
          --outbox work/alerts.sqlite --environment production
      - name: Attach status atomically without changing source timestamps
        run: >-
          uv run python -m insider_turning_engine.export.settings
          --directory app/public/data --settings work/settings-status.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Resolve GitHub Pages base path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=$repository_name" >> "$GITHUB_ENV"
          fi
      - run: npm ci
        working-directory: app
      - run: npm run lint && npm run typecheck
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e
        working-directory: app
        env:
          PAGES_BASE_PATH: ''
      - run: npm run build
        working-directory: app
      - name: Validate atomic live snapshot and publication policy
        shell: bash
        run: |
          test -s app/dist/index.html
          test -s app/dist/data/dashboard.json
          test -s app/dist/data/manifest.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          from insider_turning_engine.export import (
              dashboard_experimental_publication_policy,
              dashboard_publication_policy,
              validate_dashboard_directory,
          )

          manifest = validate_dashboard_directory(Path("app/dist/data"), require_settings=True)
          publishable, _ = dashboard_publication_policy(manifest)
          if publishable:
              raise SystemExit(0)
          experimental, alerts = dashboard_experimental_publication_policy(manifest)
          if not experimental or alerts:
              raise SystemExit("live dashboard does not satisfy experimental Pages policy")
          print("Deploying LIVE_EXPERIMENTAL snapshot; validated alerts remain disabled")
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
