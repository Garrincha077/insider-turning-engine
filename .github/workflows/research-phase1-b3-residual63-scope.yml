name: Freeze B3 residual-63 continuity scope

on:
  push:
    branches:
      - research/b3-ps-pit-history
    paths:
      - "scripts/research_phase1_b3_residual63_scope.py"
      - "tests/test_research_phase1_b3_residual63_scope.py"
      - "docs/research-phase1-b3-residual63-scope-gate.md"
      - ".github/workflows/research-phase1-b3-residual63-scope.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    env:
      SCOPE83_RELEASE: research-phase1-b3-residual83-scope-v1
      SCOPE83_ASSET: b3-residual83-scope.json
      SCOPE83_ASSET_DIGEST: sha256:fa2818a00fa299b9838e6f45e2dab04d4da5512b7b4d8f71393908caf53ce7bc
      ONE_SIDED_RELEASE: research-phase1-b3-one-sided-primary-resolution-v1
      ONE_SIDED_ASSET: b3-one-sided-primary-resolution.json
      ONE_SIDED_ASSET_DIGEST: sha256:2b4e30dcac2d032e9f27495f72e67ed1cb70fc14d11ed58abe8d4e2a73d5c45b
      RESIDUAL63_KEY_DIGEST: sha256:ed13976872da6522da2973a450a1f1c39e22cc19e2ffcc8367b9cc1a1b016b50
      RESULT_RELEASE: research-phase1-b3-residual63-scope-v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --all-groups --frozen

      - name: Lint residual-63 scope implementation
        run: >-
          uv run ruff check
          scripts/research_phase1_b3_residual63_scope.py
          tests/test_research_phase1_b3_residual63_scope.py

      - name: Test residual-63 scope semantics
        run: >-
          uv run pytest -q
          tests/test_research_phase1_b3_residual63_scope.py

      - name: Download pinned sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/scope83 work/one-sided work/output
          gh release download "$SCOPE83_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SCOPE83_ASSET" --dir work/scope83
          gh release download "$ONE_SIDED_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ONE_SIDED_ASSET" --dir work/one-sided

          d1="sha256:$(sha256sum "work/scope83/$SCOPE83_ASSET" | cut -d' ' -f1)"
          d2="sha256:$(sha256sum "work/one-sided/$ONE_SIDED_ASSET" | cut -d' ' -f1)"
          test "$d1" = "$SCOPE83_ASSET_DIGEST"
          test "$d2" = "$ONE_SIDED_ASSET_DIGEST"

      - name: Freeze exact residual-63 scope
        run: >-
          uv run python scripts/research_phase1_b3_residual63_scope.py
          --scope "work/scope83/$SCOPE83_ASSET"
          --resolution "work/one-sided/$ONE_SIDED_ASSET"
          --output work/output/b3-residual63-scope.json

      - name: Assert immutable residual-63 boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(Path("work/output/b3-residual63-scope.json").read_text())
          assert p["status"] == "B3_RESIDUAL63_SCOPE_FROZEN"
          assert p["sourceRows"] == 83
          assert p["subtractedOneSidedRows"] == 20
          assert p["residualRows"] == 63
          assert p["uniqueIssuerTickerPairs"] == 27
          assert p["residualKeySha256"] == os.environ["RESIDUAL63_KEY_DIGEST"]
          assert p["performanceRead"] is False
          assert p["priceFieldsRead"] == []
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          assert p["autoExpansionAllowed"] is False
          assert p["finalResolutionContractCreated"] is False
          assert p["correctedPerformanceOpened"] is False
          print(json.dumps({
              "residualRows": p["residualRows"],
              "uniqueIssuerTickerPairs": p["uniqueIssuerTickerPairs"],
              "residualKeySha256": p["residualKeySha256"],
              "evidenceBucketCounts": p["evidenceBucketCounts"],
          }, indent=2, sort_keys=True))
          PY

      - name: Publish immutable residual-63 scope release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --title "Phase-1 B3 residual-63 continuity scope v1" \
              --notes "Exact performance-blind residual continuity queue after the 20-row one-sided primary-source resolution. Corrected performance and 2023+ OOS remain closed." \
              --prerelease
          fi
          gh release upload "$RESULT_RELEASE" \
            work/output/b3-residual63-scope.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: b3-residual63-scope-${{ github.run_id }}
          path: work/output/b3-residual63-scope.json
          retention-days: 90
