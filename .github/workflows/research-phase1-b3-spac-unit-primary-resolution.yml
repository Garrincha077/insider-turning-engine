name: Resolve B3 SPAC-unit continuity from primary SEC evidence

on:
  push:
    branches:
      - research/b3-ps-pit-history
    paths:
      - "research/b3-spac-unit-primary-evidence-v1.json"
      - "scripts/research_phase1_b3_spac_unit_primary_resolution.py"
      - "tests/test_research_phase1_b3_spac_unit_primary_resolution.py"
      - "docs/research-phase1-b3-spac-unit-continuity-gate.md"
      - ".github/workflows/research-phase1-b3-spac-unit-primary-resolution.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    env:
      SCOPE_RELEASE: research-phase1-b3-residual87-scope-v1
      SCOPE_ASSET: b3-residual87-scope.json
      SCOPE_ASSET_DIGEST: sha256:e1e2086f4e535721dd8697d810318164c6fe77f85de8c4409adc46afbe5f939f
      RESOLUTION_KEY_DIGEST: sha256:2d93f63e9002ef10c913315a7a30bde9377bebf95a7e0442ade39b496e12beba
      RESULT_RELEASE: research-phase1-b3-spac-unit-primary-resolution-v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --all-groups --frozen

      - name: Lint SPAC-unit resolver
        run: >-
          uv run ruff check
          scripts/research_phase1_b3_spac_unit_primary_resolution.py
          tests/test_research_phase1_b3_spac_unit_primary_resolution.py

      - name: Test SPAC-unit resolution semantics
        run: >-
          uv run pytest -q
          tests/test_research_phase1_b3_spac_unit_primary_resolution.py

      - name: Download exact frozen residual-87 scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/scope work/output
          gh release download "$SCOPE_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SCOPE_ASSET" --dir work/scope
          digest="sha256:$(sha256sum "work/scope/$SCOPE_ASSET" | cut -d' ' -f1)"
          test "$digest" = "$SCOPE_ASSET_DIGEST"

      - name: Resolve exact SPAC-unit rows
        run: >-
          uv run python scripts/research_phase1_b3_spac_unit_primary_resolution.py
          --scope "work/scope/$SCOPE_ASSET"
          --evidence research/b3-spac-unit-primary-evidence-v1.json
          --output work/output/b3-spac-unit-primary-resolution.json

      - name: Assert frozen SPAC-unit resolution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(
              Path("work/output/b3-spac-unit-primary-resolution.json").read_text()
          )
          assert p["status"] == "B3_SPAC_UNIT_PRIMARY_RESOLUTION_COMPLETE"
          assert p["sourceResidualRows"] == 87
          assert p["resolvedRows"] == 4
          assert p["remainingResidualRowsBeforeOtherRules"] == 83
          assert p["resolutionKeySha256"] == os.environ["RESOLUTION_KEY_DIGEST"]
          assert {r["ticker"] for r in p["resolutionRows"]} == {"DOTAU", "GLACU"}
          assert {r["componentCommonSymbol"] for r in p["resolutionRows"]} == {
              "DOTA",
              "GLAC",
          }
          assert all(
              r["successorSymbol"] == r["ticker"] for r in p["resolutionRows"]
          )
          assert all(
              r["resolutionDecision"] == "SAME_SECURITY_CONTINUITY"
              for r in p["resolutionRows"]
          )
          assert all(
              r["resultState"] == "PRICE_CONTINUOUS_ADJUSTED"
              for r in p["resolutionRows"]
          )
          assert p["performanceRead"] is False
          assert p["priceFieldsRead"] == []
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          assert p["finalResolutionContractCreated"] is False
          assert p["correctedPerformanceOpened"] is False
          print(json.dumps({
              "resolvedRows": p["resolvedRows"],
              "remainingResidualRowsBeforeOtherRules":
                  p["remainingResidualRowsBeforeOtherRules"],
              "resolutionKeySha256": p["resolutionKeySha256"],
          }, indent=2, sort_keys=True))
          PY

      - name: Publish immutable SPAC-unit resolution release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --title "Phase-1 B3 SPAC-unit primary resolution v1" \
              --notes "Performance-blind primary SEC resolution of the four exact-title SPAC-unit long-gap rows. Corrected performance and 2023+ OOS remain closed." \
              --prerelease
          fi
          gh release upload "$RESULT_RELEASE" \
            work/output/b3-spac-unit-primary-resolution.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: b3-spac-unit-primary-resolution-${{ github.run_id }}
          path: work/output/b3-spac-unit-primary-resolution.json
          retention-days: 90
