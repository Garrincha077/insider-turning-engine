name: Probe Yahoo coverage for unresolved market symbols

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-market-yahoo-unresolved-probe.yml"
      - "scripts/research_market_yahoo_pilot.py"
      - "src/insider_turning_engine/ingestion/market/yahoo_chart.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Ruff bounded Yahoo pilot
        run: uv run ruff check scripts/research_market_yahoo_pilot.py
      - name: Probe unresolved symbols ranked 101-200 through bounded Yahoo chart requests
        run: >-
          uv run python scripts/research_market_yahoo_pilot.py
          --symbols BUKS,DPDM,HRTH,MWBC,NWIN,PFBX,TRTC,BSTG,SRGZ,AAACX,ABCP,AHNR,CTDH,EMGC,MDSYF,QNTO,TRSSF,ACCA,BMTM,ENRT,GRWC,IEHC,IMII,MJNE,PGTK,RDGL,SMDM,TREIX,UNIR,VEII,BAMM,GLXZ,IHRC,LBTY,PFLEX,PHOT,SCND,UTGN,WEYL,FROPX,GRMC,ILAL,LBSR,LGIQ,PURE,RHNO,SSBP,SYTE,TGEN,WINR,BASA,CROL,DNIF,EUSP,GLFH,ISCO.OB,IVDN,JSDA,KNWN,MITI,NPS,PAYM,RVUE,SHMP,SOWG,TBTC,TNTY,WIZP,YSTR,ANTB,ARCK,BFGC,BGHM,BNET,BNXR,CMGO,CRGS,FOFN,GAXY,HBKA,HYDI,ICTV,LAWS,LUVU,MDIT,OBTX,PRDEX,SDOI,SHWZ,VPRB,XPMIX,XXII,ABQQ,ACLZ,ACRG.A.U,BICX,CCHW,CGEI,CLSH,CVSI
          --start 2016-01-01
          --end 2022-12-31
          --output work/yahoo-unresolved-probe
      - name: Assert research boundary only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(Path("work/yahoo-unresolved-probe/summary.json").read_text())
          assert s["period"] == "2016-01-01..2022-12-31"
          assert s["serverSideDateBoundsRequested"] is True
          assert s["oosOpened"] is False
          assert s["marketDataJoined"] is False
          assert s["canonicalReady"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yahoo-unresolved-probe-${{ github.run_id }}
          path: work/yahoo-unresolved-probe
          retention-days: 90
