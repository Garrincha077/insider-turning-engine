name: Corroborate residual B3 continuity with bounded SEC PIT

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-phase1-b3-residual-sec-corroboration.yml"
      - "scripts/research_phase1_b3_residual_sec_corroboration.py"
      - "tests/test_research_phase1_b3_residual_sec_corroboration.py"
      - "docs/research-phase1-b3-residual-sec-corroboration.md"

permissions:
  contents: write

concurrency:
  group: research-phase1-b3-residual-sec-corroboration-v1
  cancel-in-progress: false

env:
  CANDIDATE_RELEASE: research-phase1-b3-continuity-candidates-v1
  CANDIDATE_ASSET: b3-continuity-resolution-candidates.json
  CANDIDATE_DIGEST: sha256:806f49b3cc557f7989268f1214914efb6b587c783f270095a1d9546374a574f6
  SCOPE_RELEASE: research-phase1-b3-continuity-scope-v1
  GAP_ASSET: gap-diagnostics.csv
  GAP_DIGEST: sha256:dc8f862ea842c4db696b36c2b1421ef5bc298182a3dab9afa0a6be26fb04ed96
  LEDGER_RELEASE: research-phase1-b3-continuity-ledger-v1
  LEDGER_ASSET: b3-security-continuity-ledger.tar.gz
  LEDGER_DIGEST: sha256:34b2a8bd2b0244b5bca8767b88623ca51d7b5a37f10f57f44a9d513445f6a95f
  PS_RELEASE: research-sec-ps-pit-v1
  RESULT_RELEASE: research-phase1-b3-residual-sec-corroboration-v1

jobs:
  corroborate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen

      - name: Run focused corroboration tests
        run: uv run pytest -q tests/test_research_phase1_b3_residual_sec_corroboration.py

      - name: Verify frozen sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/candidates work/scope work/ledger work/ps/downloads work/output
          gh release view "$CANDIDATE_RELEASE" --repo "$GITHUB_REPOSITORY" --json assets > work/candidate-assets.json
          gh release view "$SCOPE_RELEASE" --repo "$GITHUB_REPOSITORY" --json assets > work/scope-assets.json
          gh release view "$LEDGER_RELEASE" --repo "$GITHUB_REPOSITORY" --json assets > work/ledger-assets.json
          python - <<'PY'
          import json, os
          checks=[
            ("work/candidate-assets.json",os.environ["CANDIDATE_ASSET"],os.environ["CANDIDATE_DIGEST"]),
            ("work/scope-assets.json",os.environ["GAP_ASSET"],os.environ["GAP_DIGEST"]),
            ("work/ledger-assets.json",os.environ["LEDGER_ASSET"],os.environ["LEDGER_DIGEST"]),
          ]
          for path,name,digest in checks:
              assets={x["name"]:x for x in json.load(open(path))["assets"]}
              assert assets[name].get("digest")==digest
          PY
          gh release download "$CANDIDATE_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$CANDIDATE_ASSET" --dir work/candidates
          gh release download "$SCOPE_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$GAP_ASSET" --dir work/scope
          gh release download "$LEDGER_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$LEDGER_ASSET" --dir work/ledger
          tar -xzf "work/ledger/$LEDGER_ASSET" -C work/ledger ca/corporate-actions.json

      - name: Download bounded 2016-2022 P/S PIT archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for year in 2016 2017 2018 2019 2020 2021 2022; do
            for q in 1 2 3 4; do
              name="sec-ps-pit-${year}q${q}.tar.gz"
              mkdir -p "work/ps/${year}q${q}"
              gh release download "$PS_RELEASE" --repo "$GITHUB_REPOSITORY"                 --pattern "$name" --dir work/ps/downloads
              tar -xzf "work/ps/downloads/$name" -C "work/ps/${year}q${q}" canonical-research.jsonl
            done
          done
          test ! -e work/ps/2023

      - name: Build bounded SEC corroboration evidence
        run: >-
          uv run python scripts/research_phase1_b3_residual_sec_corroboration.py
          --residual work/candidates/b3-continuity-resolution-candidates.json
          --gaps work/scope/gap-diagnostics.csv
          --corporate-actions work/ledger/ca/corporate-actions.json
          --pit-root work/ps
          --output-dir work/output

      - name: Assert evidence-only boundaries
        run: |
          python - <<'PY'
          import json
          s=json.load(open("work/output/summary.json"))
          assert s["status"]=="B3_RESIDUAL_SEC_CORROBORATION_COMPLETE"
          assert s["residualRows"]==162
          assert s["performanceRead"] is False
          assert s["priceFieldsRead"]==[]
          assert s["marketDataRead"] is False
          assert s["oosOpened"] is False
          assert s["productionScoringChanged"] is False
          assert s["continuityStatesChanged"]==0
          assert s["finalResolutionContractCreated"] is False
          assert s["correctedPerformanceOpened"] is False
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Persist corroboration evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Phase-1 B3 residual SEC corroboration v1"               --notes "Bounded 2016-2022 SEC PIT identity corroboration for the frozen residual B3 continuity scope. Evidence-only; no continuity states, performance, validation or OOS changed."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE"             work/output/b3-residual-sec-corroboration.json             work/output/summary.json             --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: b3-residual-sec-corroboration-${{ github.run_id }}
          path: work/output
          retention-days: 90
