name: Run Monster Winner confirmation

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-monster-winner-confirmation.yml"
      - "scripts/research_monster_winner_confirmation.py"
      - "tests/test_research_monster_winner_confirmation.py"
      - "docs/research-monster-winner-enrichment-v1-confirmation-gate.md"
      - "research/monster-winner-enrichment-v1-confirmation.json"

permissions:
  contents: write

concurrency:
  group: research-monster-winner-enrichment-confirmation-v1
  cancel-in-progress: false

env:
  STAGE_A_RELEASE: research-phase1-insider-feature-tournament-stage-a-v1
  STAGE_A_ASSET: phase1-insider-feature-tournament-stage-a-v1.tar.gz
  STAGE_A_DIGEST: sha256:06bd11f7ea2352d95e0b3bcdb997af869b6b020c46c224e5ac942bb9a0eccb0d

  CONTINUITY_AUDIT_RELEASE: research-phase1-feature-tournament-stage-b-continuity-audit-v1
  CONTINUITY_AUDIT_ASSET: feature-tournament-stage-b-continuity-audit-v1.tar.gz
  CONTINUITY_AUDIT_DIGEST: sha256:77066ec138f53c0572a206559294768c6c898270ba6dcc3b2429ac7ddddab88f

  FINAL_CONTINUITY_RELEASE: research-phase1-feature-tournament-stage-b-final-continuity-v1
  FINAL_CONTINUITY_ASSET: stage-b-final-continuity.json
  FINAL_CONTINUITY_DIGEST: sha256:24947122c8fa776dc6f5e8f628c5b45cdbec6551cf15df334421b405439b4518

  PROVIDER_AMENDMENT_RELEASE: research-phase1-feature-tournament-provider-completeness-amendment-v1
  PROVIDER_AMENDMENT_ASSET: provider-completeness-amendment.json
  PROVIDER_AMENDMENT_DIGEST: sha256:faf787e918b953dcffbcc2b714c34873d6228031e25a09e509ee58e1a067fbb2

  PATH_RELEASE: research-monster-winner-enrichment-path-feasibility-v1
  PATH_ARCHIVE: monster-winner-path-feasibility-v1.tar.gz
  PATH_ARCHIVE_DIGEST: sha256:311482bf583cb8c9d0e7e4ebcef6cf29149bc92ffc1ab5842a772c0ae7f5ad38
  PATH_SUMMARY_DIGEST: sha256:8cf04cfbf67471a84d35e393ca831d2dac47cc6f8d0909d93df3163d6eda927e

  DISCOVERY_RELEASE: research-monster-winner-enrichment-discovery-v1
  DISCOVERY_RESULT: monster-discovery-results.json
  DISCOVERY_RESULT_DIGEST: sha256:e3d081908a3b72dd4fd36e3d58b1aa38f132371ebcd1821ae771715386a61588

  MARKET_RELEASE: research-market-alpaca-v1

  CONFIRMATION_BINDING_BLOB: c04ae0a573c6b1a4676e6d95d610ca1c4939f10a
  MONSTER_DISCOVERY_HELPER_BLOB: 8f1842cebb94601d486ae8b662f1182e157e9578
  FEASIBILITY_HELPER_BLOB: 315c75c136faf8ec95ef05150ee71a9eb86ba5de
  OLD_DISCOVERY_HELPER_BLOB: 4bf0717f1d866dfbd282dd365f6e466f0cc92900
  OLD_CONFIRMATION_HELPER_BLOB: 3928f68552b19ccb5da1459ba5ba78f48ae2d0f4

  RESULT_RELEASE: research-monster-winner-enrichment-confirmation-v1
  RESULT_ARCHIVE: monster-winner-enrichment-confirmation-v1.tar.gz
  RESULT_JSON: monster-confirmation-results.json

jobs:
  confirmation:
    name: Frozen 2019-2020 monster-tail confirmation
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups --frozen

      - name: Pin frozen binding and helper blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/monster-winner-enrichment-v1-confirmation.json)" = "$CONFIRMATION_BINDING_BLOB"
          test "$(git hash-object scripts/research_monster_winner_discovery.py)" = "$MONSTER_DISCOVERY_HELPER_BLOB"
          test "$(git hash-object scripts/research_monster_winner_path_feasibility.py)" = "$FEASIBILITY_HELPER_BLOB"
          test "$(git hash-object scripts/research_phase1_feature_tournament_discovery.py)" = "$OLD_DISCOVERY_HELPER_BLOB"
          test "$(git hash-object scripts/research_phase1_feature_tournament_confirmation.py)" = "$OLD_CONFIRMATION_HELPER_BLOB"

      - name: Lint and test confirmation semantics
        run: |
          uv run ruff check scripts/research_monster_winner_confirmation.py tests/test_research_monster_winner_confirmation.py
          uv run pytest -q tests/test_research_monster_winner_confirmation.py

      - name: Assert confirmation does not use intraday highs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source=Path("scripts/research_monster_winner_confirmation.py").read_text()
          for token in ('index["high"]','index["low"]','["high"]','["low"]'):
              assert token not in source, token
          PY

      - name: Download immutable source contracts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/download/stage-a work/stage-a             work/download/continuity work/continuity             work/download/path work/path work/discovery work/output

          gh release download "$STAGE_A_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$STAGE_A_ASSET" --dir work/download/stage-a
          test "sha256:$(sha256sum "work/download/stage-a/$STAGE_A_ASSET" | cut -d' ' -f1)" = "$STAGE_A_DIGEST"
          tar -xzf "work/download/stage-a/$STAGE_A_ASSET" -C work/stage-a             summary.json stage-a-feature-matrix.csv stage-a-cutpoints.json

          gh release download "$CONTINUITY_AUDIT_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$CONTINUITY_AUDIT_ASSET" --dir work/download/continuity
          test "sha256:$(sha256sum "work/download/continuity/$CONTINUITY_AUDIT_ASSET" | cut -d' ' -f1)" = "$CONTINUITY_AUDIT_DIGEST"
          tar -xzf "work/download/continuity/$CONTINUITY_AUDIT_ASSET"             -C work/continuity ledger/continuity-ledger.csv ca/corporate-actions.json

          gh release download "$FINAL_CONTINUITY_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$FINAL_CONTINUITY_ASSET" --dir work/continuity
          test "sha256:$(sha256sum "work/continuity/$FINAL_CONTINUITY_ASSET" | cut -d' ' -f1)" = "$FINAL_CONTINUITY_DIGEST"

          gh release download "$PROVIDER_AMENDMENT_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$PROVIDER_AMENDMENT_ASSET" --dir work/continuity
          test "sha256:$(sha256sum "work/continuity/$PROVIDER_AMENDMENT_ASSET" | cut -d' ' -f1)" = "$PROVIDER_AMENDMENT_DIGEST"

          gh release download "$PATH_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$PATH_ARCHIVE" --dir work/download/path
          test "sha256:$(sha256sum "work/download/path/$PATH_ARCHIVE" | cut -d' ' -f1)" = "$PATH_ARCHIVE_DIGEST"
          tar -xzf "work/download/path/$PATH_ARCHIVE" -C work/path             summary.json monster-path-feasibility.csv
          test "sha256:$(sha256sum work/path/summary.json | cut -d' ' -f1)" = "$PATH_SUMMARY_DIGEST"

          gh release download "$DISCOVERY_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$DISCOVERY_RESULT" --dir work/discovery
          test "sha256:$(sha256sum "work/discovery/$DISCOVERY_RESULT" | cut -d' ' -f1)" = "$DISCOVERY_RESULT_DIGEST"

      - name: Download only market years needed to mature 2019-2020 confirmation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/download/market work/market
          declare -A DIGESTS=(
            [2019]=c701d559a7d5128fd07ec19e2d5d3b39eb5ae8c0d9bd51a8b278d34c9b6f9238
            [2020]=5577a548576e81c5e468b9e5027c9a8ec1ba8e1dd14ed38a0f223e797c5358e2
            [2021]=550ff3456ad16a045692a5d9d567d13ef2b8788283f4c39c3baa5d8aecd7a704
            [2022]=8a71037090cda77bc3937409ffa9fcb9c463545b5f3a7d9a73995a92759d187a
          )
          for year in 2019 2020 2021 2022; do
            asset="alpaca-market-$year.tar.gz"
            gh release download "$MARKET_RELEASE" --repo "$GITHUB_REPOSITORY"               --pattern "$asset" --dir work/download/market
            test "$(sha256sum "work/download/market/$asset" | cut -d' ' -f1)" = "${DIGESTS[$year]}"
            mkdir -p "work/market/$year"
            tar -xzf "work/download/market/$asset" -C "work/market/$year"               "canonical-market-$year.csv"
          done
          test ! -e work/market/2023

      - name: Run frozen 2019-2020 Monster Winner confirmation
        run: >-
          uv run python scripts/research_monster_winner_confirmation.py
          --stage-a-dir work/stage-a
          --path-feasibility-csv work/path/monster-path-feasibility.csv
          --path-feasibility-summary work/path/summary.json
          --ledger work/continuity/ledger/continuity-ledger.csv
          --corporate-actions work/continuity/ca/corporate-actions.json
          --final-contract "work/continuity/$FINAL_CONTINUITY_ASSET"
          --provider-amendment "work/continuity/$PROVIDER_AMENDMENT_ASSET"
          --discovery-result "work/discovery/$DISCOVERY_RESULT"
          --market-root work/market
          --output work/output

      - name: Assert confirmation boundary and report result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=json.loads(Path("work/output/monster-confirmation-results.json").read_text())
          assert p["status"]=="MONSTER_WINNER_ENRICHMENT_V1_CONFIRMATION_COMPLETE"
          assert p["confirmationEvents"]==9850
          assert p["evaluationStart"]>="2019-01-01"
          assert p["evaluationEnd"]<="2020-12-31"
          assert p["candidateCount"]==2
          assert {r["variantId"] for r in p["candidateResults"]}=={
              "F3_DRAWDOWN_252","F4_DISTANCE_BELOW"
          }
          assert p["priceFieldsRead"]==["entry_open","exact_path_close"]
          assert p["intradayHighRead"] is False
          assert p["knownSampleDiagnosticOpened"] is False
          assert p["validationOpened"] is False
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          assert p["technicalOverlayIncluded"] is False

          with Path("work/output/monster-confirmation-event-outcomes.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==9850
          assert min(r["evaluationSession"] for r in rows)>="2019-01-01"
          assert max(r["evaluationSession"] for r in rows)<="2020-12-31"

          print(json.dumps({
              "confirmedCandidates":p["confirmedCandidates"],
              "candidateResults":p["candidateResults"],
          },indent=2,sort_keys=True))
          PY

      - name: Publish immutable Monster confirmation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp docs/research-monster-winner-enrichment-v1-confirmation-gate.md work/output/
          cp research/monster-winner-enrichment-v1-confirmation.json work/output/
          tar -C work/output -czf "work/$RESULT_ARCHIVE"             monster-confirmation-results.json             monster-confirmation-event-outcomes.csv             research-monster-winner-enrichment-v1-confirmation-gate.md             monster-winner-enrichment-v1-confirmation.json

          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Monster Winner Enrichment confirmation v1"               --notes "Frozen 2019-2020 chronological confirmation for F3_DRAWDOWN_252 and F4_DISTANCE_BELOW only. 2021-2022 event diagnostics and 2023+ OOS remain unopened; production remains unchanged."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE"             "work/$RESULT_ARCHIVE"             "work/output/$RESULT_JSON"             --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: monster-winner-confirmation-${{ github.run_id }}
          path: work/output
          retention-days: 90
