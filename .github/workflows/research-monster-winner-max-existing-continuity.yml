name: Audit Monster max-existing-data continuity

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-monster-winner-max-existing-continuity.yml"
      - "scripts/research_monster_winner_max_existing_continuity.py"
      - "tests/test_research_monster_winner_max_existing_continuity.py"

permissions:
  contents: write

env:
  SCOPE_RELEASE: research-monster-winner-max-existing-feature-scope-v1
  SCOPE_ARCHIVE: monster-winner-max-existing-feature-scope-v1.tar.gz
  SCOPE_ARCHIVE_DIGEST: sha256:6c139ff5d2efcdb8dfdfc5d7023c875ff96385f6ccb27eb327fcb66b8336c27a
  SCOPE_SUMMARY_DIGEST: sha256:df8e763163943464f258f6c99997848d856f9ce9cab1a7148e56b3f06e563703
  MARKET_RELEASE: research-market-alpaca-v1
  RESULT_RELEASE: research-monster-winner-max-existing-continuity-v1
  RESULT_ARCHIVE: monster-winner-max-existing-continuity-v1.tar.gz

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen

      - name: Lint and test extension continuity
        run: |
          uv run ruff check scripts/research_monster_winner_max_existing_continuity.py tests/test_research_monster_winner_max_existing_continuity.py
          uv run pytest -q tests/test_research_monster_winner_max_existing_continuity.py

      - name: Download immutable extension feature scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/download/scope work/scope work/ca work/download/market work/market work/output
          gh release download "$SCOPE_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$SCOPE_ARCHIVE" --dir work/download/scope
          test "sha256:$(sha256sum "work/download/scope/$SCOPE_ARCHIVE" | cut -d' ' -f1)" = "$SCOPE_ARCHIVE_DIGEST"
          tar -xzf "work/download/scope/$SCOPE_ARCHIVE" -C work/scope             summary.json monster-extension-feature-matrix-2021-2022.csv
          test "sha256:$(sha256sum work/scope/summary.json | cut -d' ' -f1)" = "$SCOPE_SUMMARY_DIGEST"

      - name: Freeze bounded corporate-action inventory
        run: >-
          uv run python scripts/research_market_corporate_action_inventory.py
          --events work/scope/monster-extension-feature-matrix-2021-2022.csv
          --output-dir work/ca

      - name: Assert corporate-action boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open("work/ca/corporate-actions.json"))
          assert p["period"]==["2016-01-01","2022-12-31"]
          assert p["performanceRead"] is False
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          PY

      - name: Download frozen adjusted market 2016-2022
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A DIGESTS=(
            [2016]=df531881b67f9f42e40b2c2fff03f6ca19c0b5f9b13deb6190132b7987fb69ca
            [2017]=7515a3807249bbead7cf7edc2a2aa1d267b01fc49ddf72885c40746520e762d0
            [2018]=4a99eafc6cac31ee30d23bf82c1feccb4bbe14919f7c4df2d59e792f8a5b2f54
            [2019]=c701d559a7d5128fd07ec19e2d5d3b39eb5ae8c0d9bd51a8b278d34c9b6f9238
            [2020]=5577a548576e81c5e468b9e5027c9a8ec1ba8e1dd14ed38a0f223e797c5358e2
            [2021]=550ff3456ad16a045692a5d9d567d13ef2b8788283f4c39c3baa5d8aecd7a704
            [2022]=8a71037090cda77bc3937409ffa9fcb9c463545b5f3a7d9a73995a92759d187a
          )
          for year in 2016 2017 2018 2019 2020 2021 2022; do
            asset="alpaca-market-${year}.tar.gz"
            gh release download "$MARKET_RELEASE" --repo "$GITHUB_REPOSITORY"               --pattern "$asset" --dir work/download/market
            test "$(sha256sum "work/download/market/$asset" | cut -d' ' -f1)" = "${DIGESTS[$year]}"
            mkdir -p "work/market/$year"
            tar -xzf "work/download/market/$asset" -C "work/market/$year"               "canonical-market-${year}.csv"
          done
          test ! -e work/market/2023

      - name: Audit mature 126/252 continuity
        run: >-
          uv run python scripts/research_monster_winner_max_existing_continuity.py
          --feature-csv work/scope/monster-extension-feature-matrix-2021-2022.csv
          --feature-summary work/scope/summary.json
          --corporate-actions work/ca/corporate-actions.json
          --market-root work/market
          --output work/output

      - name: Assert performance-blind continuity boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=json.loads(Path("work/output/summary.json").read_text())
          assert p["status"]=="MONSTER_MAX_EXISTING_DATA_EXTENSION_CONTINUITY_AUDITED"
          assert p["performanceRead"] is False
          assert p["priceFieldsRead"]==[]
          assert p["featureOutcomesRead"] is False
          assert p["knownSampleOnly"] is True
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          assert p["sourceFeatureEvents"]==9872
          assert p["horizonRowCounts"]=={"126":7493,"252":4582}
          with Path("work/output/monster-extension-continuity-audit.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==12075
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Publish immutable continuity audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp work/ca/corporate-actions.json work/output/
          tar -C work/output -czf "work/$RESULT_ARCHIVE"             summary.json monster-extension-continuity-audit.csv corporate-actions.json
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Monster Winner max-existing-data continuity v1"               --notes "Performance-blind continuity audit for mature 2021-2022 126-session and 2021 252-session extension rows. 2023+ remains unopened."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE"             "work/$RESULT_ARCHIVE" work/output/summary.json             --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: monster-max-existing-continuity-${{ github.run_id }}
          path: work/output
          retention-days: 90
