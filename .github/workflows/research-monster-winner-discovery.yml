name: Run Monster Winner discovery

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-monster-winner-discovery.yml"
      - "scripts/research_monster_winner_discovery.py"
      - "tests/test_research_monster_winner_discovery.py"
      - "docs/research-monster-winner-enrichment-v1-outcome-execution-gate.md"
      - "research/monster-winner-enrichment-v1-outcome-execution.json"

permissions:
  contents: write

concurrency:
  group: research-monster-winner-enrichment-discovery-v1
  cancel-in-progress: false

env:
  STAGE_A_RELEASE: research-phase1-insider-feature-tournament-stage-a-v1
  STAGE_A_ASSET: phase1-insider-feature-tournament-stage-a-v1.tar.gz
  STAGE_A_DIGEST: sha256:06bd11f7ea2352d95e0b3bcdb997af869b6b020c46c224e5ac942bb9a0eccb0d

  CONTINUITY_AUDIT_RELEASE: research-phase1-feature-tournament-stage-b-continuity-audit-v1
  CONTINUITY_AUDIT_ASSET: feature-tournament-stage-b-continuity-audit-v1.tar.gz
  CONTINUITY_AUDIT_DIGEST: sha256:77066ec138f53c0572a206559294768c6c898270ba6dcc3b2429ac7ddddab88f

  FINAL_CONTINUITY_RELEASE: research-phase1-feature-tournament-stage-b-final-continuity-v1
  FINAL_CONTINUITY_ASSET: stage-b-final-continuity.json
  FINAL_CONTINUITY_DIGEST: sha256:24947122c8fa776dc6f5e8f628c5b45cdbec6551cf15df334421b405439b4518

  PROVIDER_AMENDMENT_RELEASE: research-phase1-feature-tournament-provider-completeness-amendment-v1
  PROVIDER_AMENDMENT_ASSET: provider-completeness-amendment.json
  PROVIDER_AMENDMENT_DIGEST: sha256:faf787e918b953dcffbcc2b714c34873d6228031e25a09e509ee58e1a067fbb2

  PATH_RELEASE: research-monster-winner-enrichment-path-feasibility-v1
  PATH_ARCHIVE: monster-winner-path-feasibility-v1.tar.gz
  PATH_ARCHIVE_DIGEST: sha256:311482bf583cb8c9d0e7e4ebcef6cf29149bc92ffc1ab5842a772c0ae7f5ad38
  PATH_SUMMARY_DIGEST: sha256:8cf04cfbf67471a84d35e393ca831d2dac47cc6f8d0909d93df3163d6eda927e

  MARKET_RELEASE: research-market-alpaca-v1

  MONSTER_DEFINITION_BLOB: 89864635996f6665f3ab0512c377ddf26d8f3689
  OUTCOME_CONTRACT_BLOB: 6aca94c3e28cd3bc27b03c792e26f729ae3f8703
  DISCOVERY_HELPER_BLOB: 4bf0717f1d866dfbd282dd365f6e466f0cc92900
  CONFIRMATION_HELPER_BLOB: 3928f68552b19ccb5da1459ba5ba78f48ae2d0f4
  FEASIBILITY_HELPER_BLOB: 315c75c136faf8ec95ef05150ee71a9eb86ba5de

  RESULT_RELEASE: research-monster-winner-enrichment-discovery-v1
  RESULT_ARCHIVE: monster-winner-enrichment-discovery-v1.tar.gz
  RESULT_JSON: monster-discovery-results.json

jobs:
  discovery:
    name: Frozen 2016-2018 monster-tail discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups --frozen

      - name: Pin frozen Monster contracts and helpers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/monster-winner-enrichment-v1.json)" = "$MONSTER_DEFINITION_BLOB"
          test "$(git hash-object research/monster-winner-enrichment-v1-outcome-execution.json)" = "$OUTCOME_CONTRACT_BLOB"
          test "$(git hash-object scripts/research_phase1_feature_tournament_discovery.py)" = "$DISCOVERY_HELPER_BLOB"
          test "$(git hash-object scripts/research_phase1_feature_tournament_confirmation.py)" = "$CONFIRMATION_HELPER_BLOB"
          test "$(git hash-object scripts/research_monster_winner_path_feasibility.py)" = "$FEASIBILITY_HELPER_BLOB"

      - name: Lint and test Monster discovery semantics
        run: |
          uv run ruff check scripts/research_monster_winner_discovery.py tests/test_research_monster_winner_discovery.py
          uv run pytest -q tests/test_research_monster_winner_discovery.py

      - name: Assert v1 does not use intraday highs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source=Path("scripts/research_monster_winner_discovery.py").read_text()
          forbidden=(
              'index["high"]',
              'index["low"]',
              '["high"]',
              '["low"]',
          )
          for token in forbidden:
              assert token not in source, token
          PY

      - name: Download immutable Stage A, continuity and path-feasibility inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/download/stage-a work/stage-a             work/download/continuity work/continuity             work/download/path work/path work/output

          gh release download "$STAGE_A_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$STAGE_A_ASSET" --dir work/download/stage-a
          test "sha256:$(sha256sum "work/download/stage-a/$STAGE_A_ASSET" | cut -d' ' -f1)" = "$STAGE_A_DIGEST"
          tar -xzf "work/download/stage-a/$STAGE_A_ASSET" -C work/stage-a             summary.json stage-a-feature-matrix.csv stage-a-cutpoints.json

          gh release download "$CONTINUITY_AUDIT_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$CONTINUITY_AUDIT_ASSET" --dir work/download/continuity
          test "sha256:$(sha256sum "work/download/continuity/$CONTINUITY_AUDIT_ASSET" | cut -d' ' -f1)" = "$CONTINUITY_AUDIT_DIGEST"
          tar -xzf "work/download/continuity/$CONTINUITY_AUDIT_ASSET"             -C work/continuity ledger/continuity-ledger.csv ca/corporate-actions.json

          gh release download "$FINAL_CONTINUITY_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$FINAL_CONTINUITY_ASSET" --dir work/continuity
          test "sha256:$(sha256sum "work/continuity/$FINAL_CONTINUITY_ASSET" | cut -d' ' -f1)" = "$FINAL_CONTINUITY_DIGEST"

          gh release download "$PROVIDER_AMENDMENT_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$PROVIDER_AMENDMENT_ASSET" --dir work/continuity
          test "sha256:$(sha256sum "work/continuity/$PROVIDER_AMENDMENT_ASSET" | cut -d' ' -f1)" = "$PROVIDER_AMENDMENT_DIGEST"

          gh release download "$PATH_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$PATH_ARCHIVE" --dir work/download/path
          test "sha256:$(sha256sum "work/download/path/$PATH_ARCHIVE" | cut -d' ' -f1)" = "$PATH_ARCHIVE_DIGEST"
          tar -xzf "work/download/path/$PATH_ARCHIVE" -C work/path             summary.json monster-path-feasibility.csv
          test "sha256:$(sha256sum work/path/summary.json | cut -d' ' -f1)" = "$PATH_SUMMARY_DIGEST"

      - name: Download only frozen market years needed to mature 2016-2018 discovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/download/market work/market
          declare -A DIGESTS=(
            [2016]=df531881b67f9f42e40b2c2fff03f6ca19c0b5f9b13deb6190132b7987fb69ca
            [2017]=7515a3807249bbead7cf7edc2a2aa1d267b01fc49ddf72885c40746520e762d0
            [2018]=4a99eafc6cac31ee30d23bf82c1feccb4bbe14919f7c4df2d59e792f8a5b2f54
            [2019]=c701d559a7d5128fd07ec19e2d5d3b39eb5ae8c0d9bd51a8b278d34c9b6f9238
            [2020]=5577a548576e81c5e468b9e5027c9a8ec1ba8e1dd14ed38a0f223e797c5358e2
          )
          for year in 2016 2017 2018 2019 2020; do
            asset="alpaca-market-$year.tar.gz"
            gh release download "$MARKET_RELEASE" --repo "$GITHUB_REPOSITORY"               --pattern "$asset" --dir work/download/market
            test "$(sha256sum "work/download/market/$asset" | cut -d' ' -f1)" = "${DIGESTS[$year]}"
            mkdir -p "work/market/$year"
            tar -xzf "work/download/market/$asset" -C "work/market/$year"               "canonical-market-$year.csv"
          done
          test ! -e work/market/2021
          test ! -e work/market/2022
          test ! -e work/market/2023

      - name: Run frozen 2016-2018 Monster Winner discovery
        run: >-
          uv run python scripts/research_monster_winner_discovery.py
          --stage-a-dir work/stage-a
          --path-feasibility-csv work/path/monster-path-feasibility.csv
          --path-feasibility-summary work/path/summary.json
          --ledger work/continuity/ledger/continuity-ledger.csv
          --corporate-actions work/continuity/ca/corporate-actions.json
          --final-contract "work/continuity/$FINAL_CONTINUITY_ASSET"
          --provider-amendment "work/continuity/$PROVIDER_AMENDMENT_ASSET"
          --market-root work/market
          --output work/output

      - name: Assert discovery boundary and report family candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path

          p=json.loads(Path("work/output/monster-discovery-results.json").read_text())
          assert p["status"]=="MONSTER_WINNER_ENRICHMENT_V1_DISCOVERY_COMPLETE"
          assert p["definitionId"]=="MONSTER_WINNER_ENRICHMENT_V1"
          assert p["discoveryEvents"]==14340
          assert p["evaluationEnd"]<="2018-12-31"
          assert p["primaryLabel"]=="M100_252_CLOSE"
          assert p["priceFieldsRead"]==["entry_open","exact_path_close"]
          assert p["intradayHighRead"] is False
          assert p["mfeClosePathsOpened"] is True
          assert p["monsterLabelsComputed"] is True
          assert p["confirmationOutcomesOpened"] is False
          assert p["knownSampleDiagnosticOpened"] is False
          assert p["validationOpened"] is False
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          assert p["compositeWeightsFit"] is False
          assert p["technicalOverlayIncluded"] is False
          assert p["variantCount"]==19

          with Path("work/output/monster-discovery-event-outcomes.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==14340
          assert max(r["evaluationSession"] for r in rows)<="2018-12-31"

          print(json.dumps({
              "labelCounts":p["labelCounts"],
              "familyCandidateCount":p["familyCandidateCount"],
              "familyCandidates":p["familyCandidates"],
              "passingVariants":[
                  {
                      "variantId":r["variantId"],
                      "family":r["family"],
                      "primaryM100":r["primaryM100"],
                      "reviewShare":r["reviewShare"],
                      "advancementChecks":r["advancementChecks"],
                  }
                  for r in p["variantResults"]
                  if r["discoveryPass"]
              ],
          },indent=2,sort_keys=True))
          PY

      - name: Publish immutable Monster discovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp docs/research-monster-winner-enrichment-v1-outcome-execution-gate.md work/output/
          cp research/monster-winner-enrichment-v1-outcome-execution.json work/output/
          tar -C work/output -czf "work/$RESULT_ARCHIVE"             monster-discovery-results.json             monster-discovery-event-outcomes.csv             research-monster-winner-enrichment-v1-outcome-execution-gate.md             monster-winner-enrichment-v1-outcome-execution.json

          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Monster Winner Enrichment discovery v1"               --notes "Frozen 2016-2018 monster-tail discovery using close-path M100 as the primary target and conservative all-observed-cohort denominator semantics. 2019-2020 confirmation outcomes, 2021-2022 known-sample diagnostics and 2023+ OOS remain unopened."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE"             "work/$RESULT_ARCHIVE"             "work/output/$RESULT_JSON"             --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: monster-winner-discovery-${{ github.run_id }}
          path: work/output
          retention-days: 90
