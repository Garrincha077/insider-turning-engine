name: Freeze Phase-1 B3 unresolved continuity scope

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-phase1-b3-continuity-scope.yml"
      - "scripts/research_phase1_b3_continuity_scope.py"
      - "tests/test_research_phase1_b3_continuity_scope.py"
      - "docs/research-phase1-b3-continuity-unresolved-scope.md"

permissions:
  contents: write

concurrency:
  group: research-phase1-b3-continuity-scope-v1
  cancel-in-progress: false

env:
  SOURCE_RELEASE: research-phase1-b3-continuity-ledger-v1
  SOURCE_ASSET: b3-security-continuity-ledger.tar.gz
  SOURCE_DIGEST: sha256:34b2a8bd2b0244b5bca8767b88623ca51d7b5a37f10f57f44a9d513445f6a95f
  MARKET_RELEASE: research-market-alpaca-v1
  RESULT_RELEASE: research-phase1-b3-continuity-scope-v1

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen

      - name: Test scope and gap semantics
        run: >-
          uv run pytest -q
          tests/test_research_phase1_b3_continuity_scope.py
          tests/test_research_phase1_security_gap_diagnostics.py

      - name: Verify and extract frozen continuity source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source work/downloads work/market work/scope work/gaps
          gh release view "$SOURCE_RELEASE" --repo "$GITHUB_REPOSITORY" --json assets > work/assets.json
          python - <<'PY'
          import json, os
          assets={x["name"]:x for x in json.load(open("work/assets.json"))["assets"]}
          assert assets[os.environ["SOURCE_ASSET"]].get("digest")==os.environ["SOURCE_DIGEST"]
          PY
          gh release download "$SOURCE_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$SOURCE_ASSET" --dir work/source
          tar -xzf "work/source/$SOURCE_ASSET" -C work/source
          test -s work/source/ledger/continuity-ledger.csv
          test -s work/source/ledger/summary.json
          test -s work/source/ca/corporate-actions.json

      - name: Freeze exact unresolved key set
        run: >-
          uv run python scripts/research_phase1_b3_continuity_scope.py
          --ledger work/source/ledger/continuity-ledger.csv
          --ledger-summary work/source/ledger/summary.json
          --output work/scope/b3-unresolved-continuity-scope.json
          --source-release "$SOURCE_RELEASE"
          --source-asset "$SOURCE_ASSET"
          --source-asset-digest "$SOURCE_DIGEST"

      - name: Download bounded market session evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$MARKET_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern 'alpaca-market-20*.tar.gz' --dir work/downloads
          for year in 2016 2017 2018 2019 2020 2021 2022; do
            mkdir -p "work/market/$year"
            tar -xzf "work/downloads/alpaca-market-$year.tar.gz" -C "work/market/$year"
          done
          test ! -e work/market/2023

      - name: Diagnose only frozen B3 long gaps
        run: >-
          uv run python scripts/research_phase1_security_gap_diagnostics.py
          --ledger work/source/ledger/continuity-ledger.csv
          --market-root work/market
          --output-dir work/gaps

      - name: Assert frozen scope and performance blindness
        run: |
          python - <<'PY'
          import json
          scope=json.load(open("work/scope/b3-unresolved-continuity-scope.json"))
          gaps=json.load(open("work/gaps/summary.json"))
          assert scope["status"]=="B3_UNRESOLVED_CONTINUITY_SCOPE_FROZEN"
          assert scope["frozenScope"]["expectedSourceUnresolvedRows"]==264
          assert scope["frozenScope"]["longInternalGapRows"]==200
          assert scope["frozenScope"]["providerRows"]==64
          assert scope["performanceRead"] is False
          assert scope["priceFieldsRead"]==[]
          assert scope["oosOpened"] is False
          assert gaps["gapEventHorizonRows"]==200
          assert gaps["allGapsBracketedByObservedBars"] is True
          assert gaps["priceFieldsRead"]==[]
          assert gaps["performanceRead"] is False
          assert gaps["oosOpened"] is False
          print(json.dumps({
            "scope": scope["frozenScope"],
            "gapSummary": gaps,
          }, indent=2, sort_keys=True))
          PY

      - name: Persist frozen B3 continuity scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Phase-1 B3 frozen continuity scope v1"               --notes "Exact performance-blind unresolved B3 continuity scope plus frozen long-gap diagnostics. No returns, OHLC, validation or 2023+ OOS read."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE"             work/scope/b3-unresolved-continuity-scope.json             work/gaps/gap-diagnostics.csv             work/gaps/summary.json             --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: b3-continuity-scope-${{ github.run_id }}
          path: |
            work/scope/b3-unresolved-continuity-scope.json
            work/gaps/gap-diagnostics.csv
            work/gaps/summary.json
          retention-days: 90
