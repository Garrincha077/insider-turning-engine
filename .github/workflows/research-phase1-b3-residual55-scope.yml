name: Freeze B3 residual-55 continuity scope

on:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - "scripts/research_phase1_b3_residual55_scope.py"
      - "tests/test_research_phase1_b3_residual55_scope.py"
      - "docs/research-phase1-b3-residual55-scope-gate.md"
      - ".github/workflows/research-phase1-b3-residual55-scope.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    env:
      SCOPE_RELEASE: research-phase1-b3-residual63-scope-v1
      SCOPE_ASSET: b3-residual63-scope.json
      SCOPE_ASSET_DIGEST: sha256:c217df79265aeb16bd9cf2abe78b9e4573311b52dfd377b5b706e63417f21f39
      RESOLUTION_RELEASE: research-phase1-b3-spac-unit2-primary-resolution-v1
      RESOLUTION_ASSET: b3-spac-unit2-primary-resolution.json
      RESOLUTION_ASSET_DIGEST: sha256:1a4e0b9fb67ce72a80d49b39ec827b3ad2ca8e5ce53ca36bcdf44470bf2ecb04
      RESIDUAL_KEY_DIGEST: sha256:378820b3ab1a31441aa5b6a3e0faa54c51961e08aa5747d502a5638000e5a6dc
      RESULT_RELEASE: research-phase1-b3-residual55-scope-v1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync frozen environment
        run: uv sync --all-groups --frozen
      - name: Lint
        run: >-
          uv run ruff check
          scripts/research_phase1_b3_residual55_scope.py
          tests/test_research_phase1_b3_residual55_scope.py
      - name: Test
        run: uv run pytest -q tests/test_research_phase1_b3_residual55_scope.py
      - name: Download pinned sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/scope work/resolution work/output
          gh release download "$SCOPE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$SCOPE_ASSET" --dir work/scope
          gh release download "$RESOLUTION_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$RESOLUTION_ASSET" --dir work/resolution
          test "sha256:$(sha256sum "work/scope/$SCOPE_ASSET" | cut -d' ' -f1)" = "$SCOPE_ASSET_DIGEST"
          test "sha256:$(sha256sum "work/resolution/$RESOLUTION_ASSET" | cut -d' ' -f1)" = "$RESOLUTION_ASSET_DIGEST"
      - name: Freeze residual-55
        run: >-
          uv run python scripts/research_phase1_b3_residual55_scope.py
          --scope "work/scope/$SCOPE_ASSET"
          --resolution "work/resolution/$RESOLUTION_ASSET"
          --output work/output/b3-residual55-scope.json
      - name: Assert boundary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path("work/output/b3-residual55-scope.json").read_text())
          assert p["status"]=="B3_RESIDUAL55_SCOPE_FROZEN"
          assert p["sourceRows"]==63
          assert p["subtractedSpacRows"]==8
          assert p["residualRows"]==55
          assert p["uniqueIssuerTickerPairs"]==23
          assert p["residualKeySha256"]==os.environ["RESIDUAL_KEY_DIGEST"]
          assert p["performanceRead"] is False
          assert p["priceFieldsRead"]==[]
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          assert p["correctedPerformanceOpened"] is False
          print(json.dumps({"rows":55,"pairs":23,"digest":p["residualKeySha256"],"buckets":p["evidenceBucketCounts"]},indent=2))
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" --title "Phase-1 B3 residual-55 continuity scope v1" --notes "Exact performance-blind residual scope after second SPAC-unit resolution." --prerelease
          fi
          gh release upload "$RESULT_RELEASE" work/output/b3-residual55-scope.json --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: b3-residual55-scope-${{ github.run_id }}
          path: work/output/b3-residual55-scope.json
          retention-days: 90
