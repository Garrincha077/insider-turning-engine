name: Daily research pipeline

on:
  # The SEC filing cutoff is deliberately after the US market close.  GitHub
  # cron uses UTC and the range 2-6 is Tuesday through Saturday.
  schedule:
    - cron: "30 2 * * 2-6"
    - cron: "0 3 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      fixture_only:
        description: Run the offline fixture smoke test only
        required: false
        default: false
        type: boolean
      run_sec_backfill:
        description: Run a quarterly SEC bulk backfill now
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: daily-research-pipeline
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  UV_FROZEN: "1"
  SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}

jobs:
  fixture-dry-run:
    name: Fixture-only dry run
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fixture_only == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Run offline fixture validation (no network or alerts)
        run: uv run insider-turning daily --fixture-only

  quarterly-sec-backfill:
    name: Quarterly SEC backfill
    if: >-
      ${{
        (github.event_name == 'schedule' && github.event.schedule == '0 3 1 1,4,7,10 *') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_sec_backfill == true)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Determine completed SEC quarter
        id: quarter
        shell: bash
        run: |
          set -euo pipefail
          month="$(date -u +%m)"
          year="$(date -u +%Y)"
          quarter=$(( (10#$month - 1) / 3 ))
          # On the first day of a quarter, backfill the quarter that just ended.
          if (( quarter == 0 )); then
            year=$((year - 1)); quarter=4
          fi
          echo "year=$year" >> "$GITHUB_OUTPUT"
          echo "quarter=$quarter" >> "$GITHUB_OUTPUT"
      - name: Stage official SEC bulk archive
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: >-
          uv run insider-turning backfill-sec
          --year ${{ steps.quarter.outputs.year }}
          --quarter ${{ steps.quarter.outputs.quarter }}
          --cache-dir data/cache/sec
          --staging-dir data/staging/sec
          --execute
      - name: Validate normalized SEC Parquet staging
        shell: bash
        run: |
          set -euo pipefail
          partition="data/staging/sec/year=${{ steps.quarter.outputs.year }}/quarter=${{ steps.quarter.outputs.quarter }}"
          PARTITION="$partition" uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import polars as pl

          root = Path(os.environ["PARTITION"])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("source") != "sec" or manifest.get("schema_version") != "1.0":
              raise SystemExit("invalid SEC staging manifest contract")
          tables = manifest.get("tables")
          if not isinstance(tables, list) or not tables:
              raise SystemExit("normalized SEC staging has no Parquet tables")
          expected = {"manifest.json"}
          parsed_rows = 0
          for table in tables:
              path = str(table["path"])
              target = root / path
              if Path(path).name != path or not path.endswith(".parquet") or path in expected:
                  raise SystemExit("invalid SEC staging table path")
              content = target.read_bytes()
              if hashlib.sha256(content).hexdigest() != table["sha256"]:
                  raise SystemExit("SEC staging table hash mismatch")
              rows = pl.read_parquet(target).height
              if rows != table["rows"]:
                  raise SystemExit("SEC staging table row count mismatch")
              parsed_rows += rows
              expected.add(path)
          quarantined = int(manifest.get("quarantined_rows", -1))
          if quarantined > 0:
              expected.add("quarantine.jsonl")
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit("SEC staging contains missing or unreferenced files")
          total = parsed_rows + quarantined
          rate = parsed_rows / total if total else 0.0
          if (
              parsed_rows != manifest.get("parsed_rows")
              or total != manifest.get("total_rows")
              or abs(rate - float(manifest.get("parse_success_rate", -1))) > 1e-12
              or rate < 0.995
          ):
              raise SystemExit("SEC staging parse-success quality gate failed")
          PY
      - name: Publish idempotent versioned SEC Release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.quarter.outputs.year }}-q${{ steps.quarter.outputs.quarter }}"
          release_tag="sec-${version}"
          archive="insider-turning-sec-${version}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C data/staging/sec "year=${{ steps.quarter.outputs.year }}/quarter=${{ steps.quarter.outputs.quarter }}"
          sha256sum "$archive" > "${archive}.sha256"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            existing_dir="$(mktemp -d)"
            gh release download "$release_tag" --pattern "${archive}*" --dir "$existing_dir"
            cmp -s "$archive" "$existing_dir/$archive" && \
              cmp -s "${archive}.sha256" "$existing_dir/${archive}.sha256" || {
              echo "immutable SEC release assets differ from regenerated quarter"
              exit 1
            }
          else
            gh release create "$release_tag" "$archive" "${archive}.sha256" \
              --title "SEC normalized dataset ${version}" \
              --notes "Versioned normalized SEC Parquet staging for ${version}."
          fi

  daily:
    name: Ingest, score, gate, and persist state
    if: >-
      ${{
        github.event_name != 'workflow_dispatch' || inputs.fixture_only != true
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      publishable: ${{ steps.quality.outputs.publishable }}
      alerts_allowed: ${{ steps.quality.outputs.alerts_allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Create run workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run
          mkdir -p run/{staging,warehouse,public/data,alerts,state,components}
          echo "run_gh_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_daily_pipeline" > run/run-id
      - name: Restore SEC cursor from orphan state branch
        id: state-restore
        shell: bash
        run: |
          set -euo pipefail
          allowed_re='^(watermarks\.json|sec\.cursor|prior-scores\.json|prior-states\.json|alert-outbox\.jsonl|alert-history\.jsonl|alerts\.sqlite)$'
          expected_sha="$(git ls-remote origin refs/heads/state | awk 'NR==1 {print $1}')"
          rm -rf state-previous
          mkdir state-previous
          if [[ -n "$expected_sha" ]]; then
            git fetch --no-tags origin "refs/heads/state:refs/remotes/origin/state"
            forbidden="$(git ls-tree -r --name-only refs/remotes/origin/state | grep -Ev "$allowed_re" || true)"
            test -z "$forbidden" || {
              echo "state branch contains forbidden paths: $forbidden"
              exit 1
            }
            git archive refs/remotes/origin/state | tar -x -C state-previous
            if [[ -f state-previous/sec.cursor ]]; then
              cp state-previous/sec.cursor run/state/sec.cursor
            fi
            if [[ -f state-previous/alerts.sqlite ]]; then
              cp state-previous/alerts.sqlite run/state/alerts.sqlite
            fi
          fi
          echo "STATE_BASE_SHA=$expected_sha" >> "$GITHUB_ENV"
      - name: SEC incremental stage
        id: sec
        shell: bash
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          cik_file="${SEC_CIK_FILE:-config/universe-ciks.txt}"
          # Prefer the live SEC adapter.  A missing or invalid configured
          # universe is a degraded source, never an invented universe.
          if [[ -s "$cik_file" ]] && awk '
            BEGIN { valid=1; count=0 }
            {
              line=$0
              sub(/^[[:space:]]+/, "", line)
              sub(/[[:space:]]+$/, "", line)
              if (line == "" || line ~ /^#/) next
              if (line !~ /^[0-9]{1,10}$/) valid=0
              else count++
            }
            END { exit !(valid && count > 0) }
          ' "$cik_file"; then
            # The live cursor remains the last published checkpoint.  SEC may
            # advance only a pending copy until the resulting PASS snapshot
            # proves that it includes the whole fetched batch.
            cp run/state/sec.cursor run/state/sec.cursor.pending 2>/dev/null || true
            uv run insider-turning update-sec \
              --cik-file "$cik_file" \
              --cursor-file run/state/sec.cursor.pending \
              --output run/staging/sec-incremental.json \
              --run-id "$(cat run/run-id)" \
              --execute
          # Keep a deployment-provided XML as a deterministic local fallback.
          # It is useful for replay, but is never synthesized when absent.
          elif [[ -f data/incoming/sec.xml && -f data/incoming/sec.json ]]; then
            uv run insider-turning update-sec \
              --xml data/incoming/sec.xml \
              --accession "$(jq -r .accession data/incoming/sec.json)" \
              --source-url "$(jq -r .sourceUrl data/incoming/sec.json)" \
              --run-id "$(cat run/run-id)" \
              --output run/staging/sec-incremental.json
          else
            echo "SEC CIK universe is unavailable; marking run degraded" | tee run/staging/sec-warning.txt
          fi
      - name: Market daily stage
        id: market
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f data/incoming/market.csv ]]; then
            uv run insider-turning update-market \
              --csv-path data/incoming/market.csv \
              --output run/warehouse/market.parquet \
              --as-of "$(date -u +%F)"
            market_session="$(uv run python - <<'PY'
          import polars as pl

          session = pl.read_parquet("run/warehouse/market.parquet").select(
              pl.col("date").max()
          ).item()
          if session is None:
              raise SystemExit("market input contains no eligible sessions")
          print(session.isoformat())
          PY
            )"
            echo "MARKET_SESSION=$market_session" >> "$GITHUB_ENV"
          else
            echo "market input is unavailable; marking run degraded" | tee run/staging/market-warning.txt
          fi
      - name: Build bounded features
        id: features
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f run/warehouse/market.parquet ]]; then
            uv run insider-turning build-features \
              --market run/warehouse/market.parquet \
              --output run/warehouse/price-features.parquet \
              --as-of "${MARKET_SESSION:?market session was not established}"
          else
            echo "feature stage skipped because market stage was degraded"
          fi
      - name: Score each ticker independently
        id: signals
        shell: bash
        run: |
          set -uo pipefail
          ticker_file="${TICKER_UNIVERSE_FILE:-config/universe.txt}"
          failures=0
          if [[ -f "$ticker_file" ]]; then
            while IFS= read -r ticker; do
              [[ -z "$ticker" || "$ticker" == \#* ]] && continue
              component="run/components/${ticker}.json"
              output="run/warehouse/scores-${ticker}.json"
              if [[ ! -f "$component" ]]; then
                echo "ticker $ticker has no component input; continuing" | tee -a run/staging/ticker-warnings.txt
                failures=$((failures + 1))
                continue
              fi
              if ! uv run insider-turning build-signals --components "$component" --output "$output"; then
                echo "ticker $ticker failed scoring; continuing" | tee -a run/staging/ticker-warnings.txt
                failures=$((failures + 1))
              fi
            done < "$ticker_file"
          else
            echo "ticker universe is unavailable; no signal snapshot can be publishable" | tee run/staging/ticker-warnings.txt
          fi
          echo "failed_tickers=$failures" >> "$GITHUB_OUTPUT"
      - name: Export a candidate dashboard snapshot
        id: export
        shell: bash
        run: |
          set -euo pipefail
          # The scoring adapter writes this immutable, point-in-time input.
          # Never fall back to a previous dashboard when it is absent.
          if [[ -f run/warehouse/dashboard-input.json ]]; then
            uv run insider-turning export-dashboard \
              --source run/warehouse/dashboard-input.json \
              --output run/public/data
          else
            echo "dashboard input is unavailable; publication is blocked" | tee run/staging/dashboard-warning.txt
          fi
      - name: Validate manifest, snapshots, hashes, and quality gates
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json, os
          from pathlib import Path

          from insider_turning_engine.export.dashboard import (
              DashboardExportError,
              dashboard_publication_policy,
              validate_dashboard_directory,
          )

          root = Path("run/public/data")
          publishable = False
          alerts_allowed = False
          reasons = []
          try:
              manifest = validate_dashboard_directory(root)
              publishable, alerts_allowed = dashboard_publication_policy(manifest)
          except (DashboardExportError, OSError, ValueError, TypeError, json.JSONDecodeError) as exc:
              reasons.append(f"INVALID_SNAPSHOT:{type(exc).__name__}")
          Path("run/staging/quality.json").write_text(
              json.dumps({"publishable": publishable, "alertsAllowed": alerts_allowed, "issues": reasons}, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publishable={'true' if publishable else 'false'}\n")
              output.write(f"alerts_allowed={'true' if alerts_allowed else 'false'}\n")
          if reasons:
              print("quality gate blocked publication:", ", ".join(sorted(set(reasons))))
          PY
      - name: Quality-gated, idempotent alert delivery
        if: ${{ steps.quality.outputs.alerts_allowed == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f run/alerts/candidates.json ]]; then
            if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
              echo "Telegram credentials are not configured; retaining candidates in the outbox"
              uv run insider-turning send-alerts \
              --candidates run/alerts/candidates.json \
              --outbox run/state/alerts.sqlite \
              --manifest run/public/data/manifest.json
            else
              uv run insider-turning send-alerts \
                --candidates run/alerts/candidates.json \
                --outbox run/state/alerts.sqlite \
                --manifest run/public/data/manifest.json --execute
            fi
          else
            echo "No alert candidate file; retaining an empty auditable outbox"
          fi
      - name: Prepare and atomically update the orphan state branch
        if: ${{ always() && steps.state-restore.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          allowed=(watermarks.json sec.cursor prior-scores.json prior-states.json alert-outbox.jsonl alert-history.jsonl alerts.sqlite)
          expected_sha="${STATE_BASE_SHA:-}"
          rm -rf state-previous state-next
          mkdir state-previous state-next
          if [[ -n "$expected_sha" ]]; then
            git fetch --no-tags origin "refs/heads/state:refs/remotes/origin/state"
            git archive refs/remotes/origin/state | tar -x -C state-previous
          fi
          # Copy only durable operational state.  In particular, raw filings,
          # provider caches, parquet, and generated dashboards never enter this branch.
          # Watermarks advance only after a PASS-quality snapshot.  A
          # degraded/experimental or blocked run must replay its inputs on
          # the next invocation instead of silently moving the checkpoint.
          publishable_quality="$(jq -r '.quality.disposition // ""' run/public/data/manifest.json 2>/dev/null || true)"
          sec_batch_included=true
          if [[ -f run/state/sec.cursor.pending ]] && ! cmp -s run/state/sec.cursor.pending state-previous/sec.cursor; then
            sec_batch_included=false
            if [[ "$publishable_quality" == "PASS" ]] && \
               [[ -s run/staging/sec-incremental.json ]] && \
               python - <<'PY'
          import base64
          import hashlib
          import json
          from datetime import datetime
          from pathlib import Path

          def instant(value: str) -> datetime:
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          batch_path = Path("run/staging/sec-incremental.json")
          commit_marker = Path("run/staging/sec-batch-committed.sha256")
          payload = json.loads(batch_path.read_text(encoding="utf-8"))
          manifest = json.loads(Path("run/public/data/manifest.json").read_text(encoding="utf-8"))
          if not commit_marker.is_file():
              raise SystemExit("SEC batch has no canonical commit evidence")
          committed_hash = commit_marker.read_text(encoding="utf-8").strip()
          actual_hash = hashlib.sha256(batch_path.read_bytes()).hexdigest()
          if committed_hash != actual_hash:
              raise SystemExit("SEC canonical commit evidence does not match the fetched batch")
          if payload.get("failures") or payload.get("quarantines"):
              raise SystemExit("SEC batch is incomplete")
          accepted = [
              instant(record["timestamps"]["acceptedAt"])
              for record in payload.get("records", [])
              if record.get("timestamps", {}).get("acceptedAt")
          ]
          if not accepted:
              raise SystemExit("pending SEC cursor has no represented records")
          cursor_doc = json.loads(Path("run/state/sec.cursor.pending").read_text(encoding="utf-8"))
          cursor = str(cursor_doc["cursor"])
          decoded = json.loads(base64.urlsafe_b64decode(cursor + "=" * (-len(cursor) % 4)))
          cursor_accepted = instant(str(decoded[1]))
          watermark = manifest.get("watermarks", {}).get("secAcceptedThrough")
          if watermark is None:
              raise SystemExit("PASS snapshot has no SEC watermark")
          batch_max = max(accepted)
          if cursor_accepted != batch_max or instant(str(watermark)) < batch_max:
              raise SystemExit("PASS snapshot does not include the pending SEC batch")
          PY
            then
              sec_batch_included=true
              cp run/state/sec.cursor.pending run/state/sec.cursor
            else
              echo "pending SEC cursor was not proven by the PASS snapshot; preserving prior cursor"
            fi
          fi
          state_can_advance=false
          if [[ "$publishable_quality" == "PASS" && "$sec_batch_included" == "true" ]]; then
            state_can_advance=true
          fi
          if [[ "$state_can_advance" == "true" ]]; then
            jq '.watermarks // {}' run/public/data/manifest.json > run/state/watermarks.json
          else
            cp state-previous/watermarks.json run/state/watermarks.json 2>/dev/null || echo '{}' > run/state/watermarks.json
          fi
          # A quarantined corrupt ledger is audit evidence, not an empty
          # replacement for cooldown/history state. Preserve the last remote
          # ledger until an operator explicitly resolves the recovery.
          if compgen -G 'run/state/alerts.sqlite.corrupt-*' > /dev/null; then
            rm -f run/state/alerts.sqlite
          fi
          for file in "${allowed[@]}"; do
            [[ "$file" == "watermarks.json" ]] && continue
            if [[ -f "run/state/$file" && ( "$state_can_advance" == "true" || "$file" == "alerts.sqlite" || "$file" == "alert-outbox.jsonl" || "$file" == "alert-history.jsonl" ) ]]; then
              cp "run/state/$file" "state-next/$file"
            elif [[ -f "state-previous/$file" ]]; then
              cp "state-previous/$file" "state-next/$file"
            else
              case "$file" in
                sec.cursor|alerts.sqlite) : ;;
                *.json) echo '{}' > "state-next/$file" ;;
                *) : > "state-next/$file" ;;
              esac
            fi
          done
          cp run/state/watermarks.json state-next/watermarks.json
          if [[ -f state-next/alerts.sqlite ]] && (( $(stat -c '%s' state-next/alerts.sqlite) > 10485760 )); then
            echo "alert outbox exceeds the 10 MiB operational-state limit"
            exit 1
          fi
          # Reuse checkout authentication in an isolated .git directory. Preserve
          # the existing state history and reject concurrent writes, never force push.
          uv run python -m insider_turning_engine.notifications.state_store sync \
            --store work/daily-state --incoming state-next --expected-head "$expected_sha"
      - name: Retain run audit bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-${{ github.run_id }}
          path: |
            run/staging
            run/state/alerts.sqlite.corrupt-*
          if-no-files-found: warn
          retention-days: 14
      - name: Retain validated dashboard bundle
        if: ${{ steps.quality.outputs.publishable == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}
          path: run/public/data
          if-no-files-found: error
          retention-days: 14

  publish-pages:
    name: Publish validated Pages snapshot
    needs: daily
    if: ${{ needs.daily.result == 'success' && needs.daily.outputs.publishable == 'true' }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Create clean dashboard artifact target
        shell: bash
        run: |
          rm -rf app/public/data
          mkdir -p app/public/data
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}
          path: app/public/data
      - name: Validate new manifest and every referenced snapshot before upload
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          from insider_turning_engine.export.dashboard import (
              dashboard_publication_policy,
              validate_dashboard_directory,
          )

          manifest = validate_dashboard_directory(Path("app/public/data"))
          publishable, _ = dashboard_publication_policy(manifest)
          if not publishable:
              raise SystemExit("dashboard artifact does not satisfy Pages publication policy")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Resolve GitHub Pages base path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=$repository_name" >> "$GITHUB_ENV"
          fi
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Validate built dashboard before Pages upload
        shell: bash
        run: test -s app/dist/index.html && test -s app/dist/data/manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish versioned dashboard artifact
    needs: daily
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/v') &&
        needs.daily.result == 'success' &&
        needs.daily.outputs.publishable == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}
          path: dashboard
      - name: Build versioned release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="insider-turning-${GITHUB_REF_NAME}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C dashboard .
          sha256sum "$archive" > "${archive}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: insider-turning-${{ github.ref_name }}
          path: |
            insider-turning-${{ github.ref_name }}.tar.gz
            insider-turning-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Attach archive to the versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="insider-turning-${GITHUB_REF_NAME}.tar.gz"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            existing_dir="$(mktemp -d)"
            gh release download "$GITHUB_REF_NAME" --pattern "${archive}*" --dir "$existing_dir"
            cmp -s "$archive" "$existing_dir/$archive" && \
              cmp -s "${archive}.sha256" "$existing_dir/${archive}.sha256" || {
              echo "immutable dashboard release assets differ from regenerated tag"
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "${archive}.sha256" --generate-notes
          fi
