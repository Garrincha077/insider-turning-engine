name: Freeze Monster max-existing-data feature scope

on:
  workflow_dispatch:
  push:
    branches: [research/b3-ps-pit-history]
    paths:
      - ".github/workflows/research-monster-winner-max-existing-feature-scope.yml"
      - "scripts/research_monster_winner_max_existing_feature_scope.py"
      - "tests/test_research_monster_winner_max_existing_feature_scope.py"
      - "docs/research-monster-winner-max-existing-data-extension-gate.md"

permissions:
  contents: write

env:
  SEC_RELEASE: research-sec-amendments-v1
  SEC_ASSET: sec-amendment-reconciliation-2013-2022.tar.gz
  SEC_DIGEST: sha256:fc4acf047f2705573e7511f4c96295788b09405029be2c18dcb8e28546f2022f

  STAGE_A_RELEASE: research-phase1-insider-feature-tournament-stage-a-v1
  STAGE_A_ASSET: phase1-insider-feature-tournament-stage-a-v1.tar.gz
  STAGE_A_DIGEST: sha256:06bd11f7ea2352d95e0b3bcdb997af869b6b020c46c224e5ac942bb9a0eccb0d

  ADJUSTED_RELEASE: research-market-alpaca-v1
  RAW_BASE_RELEASE: research-market-alpaca-raw-feature-context-v1
  RAW_EXT_RELEASE: research-market-alpaca-raw-feature-context-2021-2022-v1

  RESULT_RELEASE: research-monster-winner-max-existing-feature-scope-v1
  RESULT_ARCHIVE: monster-winner-max-existing-feature-scope-v1.tar.gz

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen

      - name: Lint and test extension scope
        run: |
          uv run ruff check scripts/research_monster_winner_max_existing_feature_scope.py tests/test_research_monster_winner_max_existing_feature_scope.py
          uv run pytest -q tests/test_research_monster_winner_max_existing_feature_scope.py

      - name: Download frozen SEC and Stage A
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/download/sec work/sec work/download/stage-a work/stage-a             work/download/adjusted work/adjusted work/download/raw-base work/raw-base             work/download/raw-ext work/raw-ext work/output

          gh release download "$SEC_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$SEC_ASSET" --dir work/download/sec
          test "sha256:$(sha256sum "work/download/sec/$SEC_ASSET" | cut -d' ' -f1)" = "$SEC_DIGEST"
          tar -xzf "work/download/sec/$SEC_ASSET" -C work/sec             effective-end-2022.jsonl reconciled-all-revisions.jsonl

          gh release download "$STAGE_A_RELEASE" --repo "$GITHUB_REPOSITORY"             --pattern "$STAGE_A_ASSET" --dir work/download/stage-a
          test "sha256:$(sha256sum "work/download/stage-a/$STAGE_A_ASSET" | cut -d' ' -f1)" = "$STAGE_A_DIGEST"
          tar -xzf "work/download/stage-a/$STAGE_A_ASSET" -C work/stage-a             stage-a-cutpoints.json summary.json

      - name: Download frozen adjusted market 2016-2022
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A DIGESTS=(
            [2016]=df531881b67f9f42e40b2c2fff03f6ca19c0b5f9b13deb6190132b7987fb69ca
            [2017]=7515a3807249bbead7cf7edc2a2aa1d267b01fc49ddf72885c40746520e762d0
            [2018]=4a99eafc6cac31ee30d23bf82c1feccb4bbe14919f7c4df2d59e792f8a5b2f54
            [2019]=c701d559a7d5128fd07ec19e2d5d3b39eb5ae8c0d9bd51a8b278d34c9b6f9238
            [2020]=5577a548576e81c5e468b9e5027c9a8ec1ba8e1dd14ed38a0f223e797c5358e2
            [2021]=550ff3456ad16a045692a5d9d567d13ef2b8788283f4c39c3baa5d8aecd7a704
            [2022]=8a71037090cda77bc3937409ffa9fcb9c463545b5f3a7d9a73995a92759d187a
          )
          for year in 2016 2017 2018 2019 2020 2021 2022; do
            asset="alpaca-market-${year}.tar.gz"
            gh release download "$ADJUSTED_RELEASE" --repo "$GITHUB_REPOSITORY"               --pattern "$asset" --dir work/download/adjusted
            test "$(sha256sum "work/download/adjusted/$asset" | cut -d' ' -f1)" = "${DIGESTS[$year]}"
            mkdir -p "work/adjusted/$year"
            tar -xzf "work/download/adjusted/$asset" -C "work/adjusted/$year"               "canonical-market-${year}.csv"
          done

      - name: Download frozen raw market 2016-2022
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A BASE_DIGESTS=(
            [2016]=b1172994bf1cf8a5ebd0470fde60b42bc4cbed22163eabcd33739c58e219375e
            [2017]=1491295b365bfe28e0e560a1d3352c1ffccd44966e83a2cd38aba637db70e68d
            [2018]=ad5000614692eb0dc4487bff3353b83ca4a47f7d32885ed1dcdbe4f9f984a340
            [2019]=68164dd34b198ff46bc78f8402a2ca48d155f9691267fd86163674c49fdf92c9
            [2020]=5fb7d5fecc473660adf995d58787ab8e6e2240a4a203eea3a4c97688a73b4103
          )
          for year in 2016 2017 2018 2019 2020; do
            asset="raw-feature-market-${year}.tar.gz"
            gh release download "$RAW_BASE_RELEASE" --repo "$GITHUB_REPOSITORY"               --pattern "$asset" --dir work/download/raw-base
            test "$(sha256sum "work/download/raw-base/$asset" | cut -d' ' -f1)" = "${BASE_DIGESTS[$year]}"
            mkdir -p "work/raw-base/$year"
            tar -xzf "work/download/raw-base/$asset" -C "work/raw-base/$year"               "raw-feature-market-${year}.csv"
          done

          declare -A EXT_DIGESTS=(
            [2021]=774998d2d64b8f439c3384f1c8d5a91d11a689feb393395d0158cac5df431500
            [2022]=bd6d8d9c1164a4fbf20bc8debca87a39627ff7c3907ef2beae5227077e3848fe
          )
          for year in 2021 2022; do
            asset="raw-feature-market-${year}.tar.gz"
            gh release download "$RAW_EXT_RELEASE" --repo "$GITHUB_REPOSITORY"               --pattern "$asset" --dir work/download/raw-ext
            test "$(sha256sum "work/download/raw-ext/$asset" | cut -d' ' -f1)" = "${EXT_DIGESTS[$year]}"
            mkdir -p "work/raw-ext/$year"
            tar -xzf "work/download/raw-ext/$asset" -C "work/raw-ext/$year"               "raw-feature-market-${year}.csv"
          done
          test ! -e work/adjusted/2023
          test ! -e work/raw-ext/2023

      - name: Freeze 2021-2022 feature/maturity scope
        run: >-
          uv run python scripts/research_monster_winner_max_existing_feature_scope.py
          --sec-effective work/sec/effective-end-2022.jsonl
          --sec-revisions work/sec/reconciled-all-revisions.jsonl
          --adjusted-root work/adjusted
          --raw-root work/raw-base
          --raw-root work/raw-ext
          --stage-a-dir work/stage-a
          --output work/output

      - name: Assert outcome-blind scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=json.loads(Path("work/output/summary.json").read_text())
          assert p["status"]=="MONSTER_MAX_EXISTING_DATA_EXTENSION_FEATURE_SCOPE_FROZEN"
          assert p["outcomesRead"] is False
          assert p["priceOutcomeFieldsRead"]==[]
          assert p["monsterLabelsComputed"] is False
          assert p["knownSampleOnly"] is True
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          assert p["evaluationPeriod"]==["2021-01-01","2022-12-31"]
          assert p["marketDataBoundary"]=="2022-12-30"
          assert p["events"]>0
          with Path("work/output/monster-extension-feature-matrix-2021-2022.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==p["events"]
          assert min(r["evaluationSession"] for r in rows)>="2021-01-01"
          assert max(r["evaluationSession"] for r in rows)<="2022-12-31"
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Publish immutable extension feature scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp docs/research-monster-winner-max-existing-data-extension-gate.md work/output/
          tar -C work/output -czf "work/$RESULT_ARCHIVE"             summary.json             monster-extension-feature-matrix-2021-2022.csv             research-monster-winner-max-existing-data-extension-gate.md
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY"               --title "Monster Winner maximum existing-data feature scope v1"               --notes "Outcome-blind 2021-2022 extension using frozen F3/F4 definitions and the maximum existing pre-2023 market corpus. No Monster outcomes opened."               --prerelease
          fi
          gh release upload "$RESULT_RELEASE"             "work/$RESULT_ARCHIVE" work/output/summary.json             --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: monster-max-existing-feature-scope-${{ github.run_id }}
          path: work/output
          retention-days: 90
