name: Resolve B3 surviving-unit continuity
# checkpoint: formatting-repaired

on:
  push:
    branches:
      - research/b3-ps-pit-history
    paths:
      - "research/b3-surviving-unit-primary-evidence-v1.json"
      - "scripts/research_phase1_b3_surviving_unit_primary_resolution.py"
      - "tests/test_research_phase1_b3_surviving_unit_primary_resolution.py"
      - "docs/research-phase1-b3-surviving-unit-continuity-gate.md"
      - ".github/workflows/research-phase1-b3-surviving-unit-primary-resolution.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    env:
      SCOPE_RELEASE: research-phase1-b3-residual24-scope-v1
      SCOPE_ASSET: b3-residual24-scope.json
      SCOPE_ASSET_DIGEST: sha256:0ae68307aa7c28e366266c14896521b33391edc8093fb51c68546e76e3a31523
      RESOLUTION_KEY_DIGEST: sha256:a59cce3f542956da1d04b11ebcf783732ac0513668ef7fff3e4f40fa95a55371
      RESULT_RELEASE: research-phase1-b3-surviving-unit-primary-resolution-v1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync frozen environment
        run: uv sync --all-groups --frozen
      - name: Lint surviving-unit resolver
        run: >-
          uv run ruff check
          scripts/research_phase1_b3_surviving_unit_primary_resolution.py
          tests/test_research_phase1_b3_surviving_unit_primary_resolution.py
      - name: Test surviving-unit semantics
        run: >-
          uv run pytest -q
          tests/test_research_phase1_b3_surviving_unit_primary_resolution.py
      - name: Download frozen residual-24 scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/scope work/output
          gh release download "$SCOPE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$SCOPE_ASSET" --dir work/scope
          digest="sha256:$(sha256sum "work/scope/$SCOPE_ASSET" | cut -d' ' -f1)"
          test "$digest" = "$SCOPE_ASSET_DIGEST"
      - name: Resolve exact surviving-unit rows
        run: >-
          uv run python scripts/research_phase1_b3_surviving_unit_primary_resolution.py
          --scope "work/scope/$SCOPE_ASSET"
          --evidence research/b3-surviving-unit-primary-evidence-v1.json
          --output work/output/b3-surviving-unit-primary-resolution.json
      - name: Assert frozen resolution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path("work/output/b3-surviving-unit-primary-resolution.json").read_text())
          assert p["status"] == "B3_SURVIVING_UNIT_PRIMARY_RESOLUTION_COMPLETE"
          assert p["sourceResidualRows"] == 24
          assert p["resolvedRows"] == 11
          assert p["remainingResidualRowsBeforeOtherRules"] == 13
          assert p["resolutionKeySha256"] == os.environ["RESOLUTION_KEY_DIGEST"]
          assert p["resolutionDecisionCounts"] == {
              "SAME_SECURITY_CONTINUITY": 9,
              "SYMBOL_CHANGED_SAME_SECURITY": 2,
          }
          assert p["performanceRead"] is False
          assert p["priceFieldsRead"] == []
          assert p["oosOpened"] is False
          assert p["productionScoringChanged"] is False
          assert p["finalResolutionContractCreated"] is False
          assert p["correctedPerformanceOpened"] is False
          print(json.dumps({
              "resolvedRows": p["resolvedRows"],
              "remainingResidualRowsBeforeOtherRules": p["remainingResidualRowsBeforeOtherRules"],
              "resolutionDecisionCounts": p["resolutionDecisionCounts"],
              "resolutionKeySha256": p["resolutionKeySha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Publish immutable surviving-unit release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RESULT_RELEASE" --repo "$GITHUB_REPOSITORY" --title "Phase-1 B3 surviving-unit resolution v1" --notes "Performance-blind primary SEC resolution of 11 frozen surviving-unit rows." --prerelease
          fi
          gh release upload "$RESULT_RELEASE" work/output/b3-surviving-unit-primary-resolution.json --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: b3-surviving-unit-primary-resolution-${{ github.run_id }}
          path: work/output/b3-surviving-unit-primary-resolution.json
          retention-days: 90
