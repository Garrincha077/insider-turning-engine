[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "insider-turning-engine"
version = "0.1.0"
description = "A data pipeline for detecting and explaining insider turning points."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "polars>=1.0",
    "pyarrow>=17.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20260518",
]

[project.scripts]
insider-turning = "insider_turning_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/insider_turning_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["insider_turning_engine"]
mypy_path = "src"

[tool.uv]
default-groups = ["dev"]
